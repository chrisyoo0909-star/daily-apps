<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cogwork — build the gear train</title>
<style>
  :root{
    --bg:#0d1017; --panel:#161c28; --panel2:#1e2634; --line:#2b3548;
    --ink:#e8edf6; --dim:#8b98ad;
    --brass:#d9a441; --brass-hi:#f5d489; --brass-lo:#8a6417;
    --green:#34d399; --amber:#fbbf24; --red:#ef4444; --idle:#5a6678;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none;}
  body{display:flex;justify-content:center;min-height:100dvh;}
  #app{width:100%;max-width:700px;padding:10px 12px 22px;display:flex;flex-direction:column;gap:10px;}

  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.02em;font-size:19px}
  .logo svg{display:block}
  .spacer{flex:1}
  .lvl{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

  .bar{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 11px;}
  .goal{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .goal .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}
  .goal .val{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
  .goal .name{font-size:13px;font-weight:700;color:var(--ink);opacity:.9}
  .divider{width:1px;background:var(--line);align-self:stretch;margin:2px 0}
  .now{color:var(--dim)}
  .now.ok{color:var(--green)}
  .now.bad{color:var(--red)}

  .wrap{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.35)}
  canvas{display:block;width:100%;height:auto;touch-action:none}

  .hint{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;font-size:12px;color:var(--dim);
    background:linear-gradient(to top,rgba(13,16,23,.92),rgba(13,16,23,0));pointer-events:none}

  .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(9,12,18,.82);backdrop-filter:blur(3px)}
  .overlay.on{display:flex}
  .win{text-align:center;padding:22px 26px}
  .win h2{margin:0 0 6px;font-size:26px;letter-spacing:.01em}
  .win p{margin:0 0 16px;color:var(--dim);font-size:13.5px}

  .tray{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 10px 5px;
    cursor:grab;touch-action:none;user-select:none;min-width:62px}
  .chip:active{cursor:grabbing}
  .chip.empty{opacity:.32;filter:grayscale(.7)}
  .chip canvas{width:38px;height:38px;pointer-events:none}
  .chip .n{font-size:11px;color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums}
  .chip .t{position:absolute;top:3px;right:6px;font-size:9px;color:var(--dim)}

  button{font:inherit;font-weight:700;font-size:13px;color:var(--ink);background:var(--panel2);
    border:1px solid var(--line);border-radius:11px;padding:9px 14px;cursor:pointer;transition:.15s}
  button:hover{background:#28324399;border-color:#3d4a63}
  button.primary{background:linear-gradient(180deg,#e8b954,#c8912c);color:#2a1e05;border-color:#a8781f}
  button.primary:hover{filter:brightness(1.08)}
  button:disabled{opacity:.4;cursor:default}
  .btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  .dots{display:flex;gap:5px;margin-left:auto}
  .dot{width:22px;height:22px;border-radius:7px;border:1px solid var(--line);background:var(--panel);
    font-size:10.5px;font-weight:800;color:var(--dim);display:grid;place-items:center;cursor:pointer;padding:0}
  .dot.on{background:var(--brass);color:#2a1e05;border-color:var(--brass)}
  .dot.done{color:var(--green);border-color:#2c5c48}

  .ghost{position:fixed;pointer-events:none;z-index:50;transform:translate(-50%,-50%);opacity:.9;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
  .foot{font-size:11.5px;color:var(--dim);text-align:center;line-height:1.5}
  @media(max-width:430px){
    .goal .val{font-size:15px}
    .chip{min-width:56px;padding:6px 8px 4px}
    .chip canvas{width:34px;height:34px}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><g fill="#d9a441"><circle cx="12" cy="12" r="6.2"/><g stroke="#d9a441" stroke-width="3.1" stroke-linecap="round"><path d="M12 2.4v3M12 18.6v3M2.4 12h3M18.6 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></g><circle cx="12" cy="12" r="2.4" fill="#161c28"/></g></svg>
      Cogwork
    </div>
    <div class="spacer"></div>
    <div class="dots" id="dots"></div>
  </header>

  <div class="bar">
    <div class="card goal">
      <div>
        <div class="lab">Puzzle</div>
        <div class="name" id="lvlName">—</div>
      </div>
      <div class="divider"></div>
      <div>
        <div class="lab">Goal</div>
        <div class="val" id="goalVal">—</div>
      </div>
      <div class="divider"></div>
      <div>
        <div class="lab">Red wheel</div>
        <div class="val now" id="nowVal">stopped</div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <canvas id="cv" width="660" height="440"></canvas>
    <div class="hint" id="hint"></div>
    <div class="overlay" id="ov">
      <div class="win">
        <h2 id="ovT">Meshed!</h2>
        <p id="ovP"></p>
        <div class="btns" style="justify-content:center">
          <button id="ovNext" class="primary">Next puzzle →</button>
          <button id="ovStay">Keep playing</button>
        </div>
      </div>
    </div>
  </div>

  <div class="tray" id="tray"></div>

  <div class="btns">
    <button id="reset">Clear board</button>
    <button id="free">Free build</button>
    <div class="spacer"></div>
    <span class="lvl" id="counter"></span>
  </div>

  <div class="foot">Drag a cog onto the board. Teeth must just touch to mesh — every mesh reverses the spin.<br>Tap a cog you placed to take it back.</div>
</div>

<script>
(function(){
"use strict";

/* ---------- geometry constants ---------- */
var U = 28;          // peg spacing (px)
var M = 22;          // board margin (px)
var W = 660, H = 440;
var MAXC = 21, MAXR = 13;
var EPS = 1.2;       // mesh tolerance in px

function px(c){ return M + c*U; }
function py(r){ return M + r*U; }
function teethOf(s){ return s*8; }
function radOf(s){ return s*U; }

/* ---------- levels ----------
   Speed magnitude of a gear train always telescopes to
   teeth(crank)/teeth(target), so only the DIRECTION is authored. */
var LEVELS = [
  { name:"First Mesh", dir:1,
    hint:"Drop a small cog between the crank and the red wheel.",
    crank:{c:4,r:7,s:1}, target:{c:8,r:7,s:1},
    tray:{1:2,2:0,3:0}, walls:[] },

  { name:"Gear Down", dir:1,
    hint:"A big wheel driven by a small one turns slower.",
    crank:{c:3,r:7,s:1}, target:{c:11,r:7,s:3},
    tray:{1:2,2:2,3:1}, walls:[] },

  { name:"Reverse", dir:-1,
    hint:"Each mesh flips the direction. Count them.",
    crank:{c:4,r:6,s:1}, target:{c:10,r:6,s:1},
    tray:{1:3,2:2,3:0}, walls:[] },

  { name:"Overdrive", dir:1,
    hint:"Big driving small speeds things up.",
    crank:{c:4,r:7,s:3}, target:{c:14,r:7,s:1},
    tray:{1:2,2:1,3:2}, walls:[] },

  { name:"Off the Grid", dir:-1,
    hint:"Cogs can mesh on a slant too, not just in a row.",
    crank:{c:4,r:4,s:2}, target:{c:8,r:13,s:1},
    tray:{1:3,2:1,3:2}, walls:[{c0:2,r0:9,c1:5,r1:13}] },

  { name:"The Gap", dir:-1,
    hint:"Span the pillars — and land the spin the right way round.",
    crank:{c:3,r:7,s:3}, target:{c:14,r:7,s:2},
    tray:{1:2,2:2,3:1}, walls:[{c0:7,r0:10,c1:9,r1:13},{c0:11,r0:0,c1:13,r1:4}] }
];

var FREE = { name:"Free build", dir:0, free:true,
  hint:"No goal here — just build. Every cog shows its speed.",
  crank:{c:4,r:7,s:2}, target:null, tray:{1:99,2:99,3:99}, walls:[] };

/* ---------- state ---------- */
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var lvlIndex = 0, level = null, gears = [], stock = {}, jam = false, won = false;
var solved = LEVELS.map(function(){ return false; });
var drag = null;         // {size, x, y, peg:{c,r}|null, ok:bool}
var ghostEl = null;
var t0 = performance.now();

/* ---------- gear helpers ---------- */
function mkGear(c,r,s,kind){
  return { c:c, r:r, s:s, kind:kind||'placed', x:px(c), y:py(r), rad:radOf(s),
           teeth:teethOf(s), w:null, ang:0 };
}
function dist(a,b){ var dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }
function meshes(a,b){ return Math.abs(dist(a,b) - (a.rad+b.rad)) <= EPS; }
function collides(a,b){ return dist(a,b) < a.rad + b.rad - EPS; }

function hitsWall(g){
  for(var i=0;i<level.walls.length;i++){
    var w = level.walls[i];
    var x0=px(w.c0), y0=py(w.r0), x1=px(w.c1), y1=py(w.r1);
    var nx = Math.max(x0, Math.min(g.x, x1));
    var ny = Math.max(y0, Math.min(g.y, y1));
    var dx = g.x-nx, dy = g.y-ny;
    if(dx*dx+dy*dy < g.rad*g.rad - 0.5) return true;
  }
  return false;
}
function inBounds(g){
  return g.x-g.rad >= -0.5 && g.x+g.rad <= W+0.5 && g.y-g.rad >= -0.5 && g.y+g.rad <= H+0.5;
}
function canPlace(c,r,s,ignore){
  var probe = mkGear(c,r,s);
  if(!inBounds(probe) || hitsWall(probe)) return false;
  for(var i=0;i<gears.length;i++){
    var g = gears[i];
    if(g===ignore) continue;
    if(g.c===c && g.r===r) return false;
    if(collides(probe,g)) return false;
  }
  return true;
}
function meshesAnything(c,r,s){
  var probe = mkGear(c,r,s);
  for(var i=0;i<gears.length;i++) if(meshes(probe,gears[i])) return true;
  return false;
}

/* ---------- simulation ---------- */
function simulate(){
  var i,j;
  for(i=0;i<gears.length;i++) gears[i].w = null;
  jam = false;
  var crank = gears[0];
  crank.w = 1;
  var queue = [crank], guard = 0;
  while(queue.length && guard++ < 5000){
    var a = queue.shift();
    for(j=0;j<gears.length;j++){
      var b = gears[j];
      if(b===a || !meshes(a,b)) continue;
      var wv = -a.w * (a.teeth / b.teeth);
      if(b.w === null){ b.w = wv; queue.push(b); }
      else if(Math.abs(b.w - wv) > 1e-9){ jam = true; }
    }
  }
  if(jam) for(i=0;i<gears.length;i++) gears[i].w = 0;
}

function goalMult(){
  if(!level.target) return 0;
  return gears[0].teeth / teethOf(level.target.s);
}
function targetGear(){
  for(var i=0;i<gears.length;i++) if(gears[i].kind==='target') return gears[i];
  return null;
}
function checkWin(){
  if(level.free || won) return;
  var t = targetGear();
  if(!t || t.w === null || jam) return;
  if(Math.sign(t.w) === level.dir && Math.abs(Math.abs(t.w) - goalMult()) < 1e-6){
    won = true;
    if(!level.free && lvlIndex >= 0) solved[lvlIndex] = true;
    showWin();
  }
}

/* ---------- rendering ---------- */
function fmtRatio(v){
  var a = Math.abs(v);
  if(a < 1e-9) return "0";
  var fr = [[1,1,"1"],[1,2,"½"],[1,3,"⅓"],[2,3,"⅔"],[3,2,"1½"],[1,9,"⅑"],[9,1,"9"]];
  for(var i=0;i<fr.length;i++){
    if(Math.abs(a - fr[i][0]/fr[i][1]) < 1e-6) return fr[i][2];
  }
  return (Math.round(a*100)/100).toString();
}
function arrowFor(sign){ return sign > 0 ? "↻" : "↺"; }

function drawGearPath(g, x, y, rad, teeth, ang){
  var root = rad*0.80, inner = rad*0.66;
  var step = (Math.PI*2)/teeth;
  ctx.beginPath();
  for(var i=0;i<teeth;i++){
    var a = ang + i*step;
    var p = [
      [root, a - step*0.30],
      [rad,  a - step*0.155],
      [rad,  a + step*0.155],
      [root, a + step*0.30]
    ];
    for(var k=0;k<4;k++){
      var xx = x + Math.cos(p[k][1])*p[k][0];
      var yy = y + Math.sin(p[k][1])*p[k][0];
      if(i===0 && k===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy);
    }
    var na = ang + (i+1)*step;
    ctx.lineTo(x + Math.cos(na - step*0.30)*root, y + Math.sin(na - step*0.30)*root);
  }
  ctx.closePath();
  return inner;
}

var PALETTE = {
  crank:{ a:'#6ee7b7', b:'#10b981', c:'#047857' },
  target:{ a:'#fcd77a', b:'#f0a921', c:'#a86c06' },
  placed:{ a:'#f0cf92', b:'#cf9c3c', c:'#7d5a15' },
  idle:{ a:'#6b7788', b:'#4a5566', c:'#333c4a' },
  jam:{ a:'#fca5a5', b:'#e04a4a', c:'#8a2020' }
};

function drawGear(g, alpha){
  var live = g.w !== null && !jam;
  var key = jam ? 'jam' : (g.kind==='crank' ? 'crank' : g.kind==='target' ? 'target' : (live ? 'placed' : 'idle'));
  var pal = PALETTE[key];
  ctx.save();
  if(alpha !== undefined) ctx.globalAlpha = alpha;

  if(live || g.kind!=='placed'){
    ctx.shadowColor = key==='jam' ? 'rgba(239,68,68,.55)'
      : key==='crank' ? 'rgba(52,211,153,.40)'
      : key==='target' ? 'rgba(251,191,36,.40)' : 'rgba(217,164,65,.30)';
    ctx.shadowBlur = 16;
  }
  var inner = drawGearPath(g, g.x, g.y, g.rad, g.teeth, g.ang);
  var grd = ctx.createLinearGradient(g.x-g.rad, g.y-g.rad, g.x+g.rad, g.y+g.rad);
  grd.addColorStop(0, pal.a); grd.addColorStop(0.55, pal.b); grd.addColorStop(1, pal.c);
  ctx.fillStyle = grd; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 1.1; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.stroke();

  // face plate
  ctx.beginPath(); ctx.arc(g.x,g.y,inner,0,Math.PI*2);
  var g2 = ctx.createRadialGradient(g.x-inner*0.4, g.y-inner*0.4, inner*0.1, g.x, g.y, inner);
  g2.addColorStop(0,'rgba(255,255,255,.20)'); g2.addColorStop(1,'rgba(0,0,0,.22)');
  ctx.fillStyle = pal.b; ctx.fill(); ctx.fillStyle = g2; ctx.fill();

  // spokes / lightening holes
  if(g.s >= 2){
    var holes = g.s===2 ? 4 : 6, hr = inner*0.30, orb = inner*0.60;
    for(var i=0;i<holes;i++){
      var a = g.ang*1 + i*(Math.PI*2/holes) + 0.3;
      ctx.beginPath();
      ctx.arc(g.x+Math.cos(a)*orb, g.y+Math.sin(a)*orb, hr, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(14,18,26,.55)'; ctx.fill();
    }
  }
  // hub
  ctx.beginPath(); ctx.arc(g.x,g.y,g.rad*0.20,0,Math.PI*2);
  ctx.fillStyle = '#0f141d'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth=1; ctx.stroke();
  // keyway mark so rotation reads clearly
  ctx.beginPath();
  ctx.moveTo(g.x + Math.cos(g.ang)*g.rad*0.20, g.y + Math.sin(g.ang)*g.rad*0.20);
  ctx.lineTo(g.x + Math.cos(g.ang)*inner*0.92, g.y + Math.sin(g.ang)*inner*0.92);
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = Math.max(2, g.rad*0.07); ctx.stroke();

  ctx.restore();

  // speed label in free build
  if(level.free && g.w !== null){
    ctx.save();
    ctx.font = '600 11px ui-sans-serif,system-ui,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle = 'rgba(232,237,246,.9)';
    ctx.fillText(arrowFor(Math.sign(g.w)) + fmtRatio(g.w) + '×', g.x, g.y + g.rad + 9);
    ctx.restore();
  }
}

function draw(now){
  var dt = Math.min(0.05, (now - t0)/1000); t0 = now;
  var i;
  for(i=0;i<gears.length;i++){
    var g = gears[i];
    if(g.w) g.ang += g.w * 1.15 * dt;
  }

  ctx.clearRect(0,0,W,H);

  // backdrop
  var bg = ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#151c29'); bg.addColorStop(1,'#10151f');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  // pegs
  ctx.fillStyle = 'rgba(255,255,255,.055)';
  for(var c=0;c<=MAXC;c++) for(var r=0;r<=MAXR;r++){
    ctx.beginPath(); ctx.arc(px(c),py(r),1.4,0,Math.PI*2); ctx.fill();
  }

  // walls
  for(i=0;i<level.walls.length;i++){
    var w = level.walls[i];
    var x0=px(w.c0)-U*0.5, y0=py(w.r0)-U*0.5, ww=(w.c1-w.c0+1)*U, hh=(w.r1-w.r0+1)*U;
    ctx.save();
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x0,y0,ww,hh,10); else ctx.rect(x0,y0,ww,hh);
    ctx.fillStyle = '#1b2534'; ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x0,y0,ww,hh,10); else ctx.rect(x0,y0,ww,hh);
    ctx.strokeStyle = 'rgba(120,140,175,.30)'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.clip();
    ctx.strokeStyle = 'rgba(120,140,175,.10)'; ctx.lineWidth=6;
    for(var k=-hh;k<ww+hh;k+=14){
      ctx.beginPath(); ctx.moveTo(x0+k,y0); ctx.lineTo(x0+k+hh,y0+hh); ctx.stroke();
    }
    ctx.restore();
  }

  // snap candidates while dragging
  if(drag){
    ctx.save();
    for(var cc=0;cc<=MAXC;cc++) for(var rr=0;rr<=MAXR;rr++){
      if(!canPlace(cc,rr,drag.size)) continue;
      if(!meshesAnything(cc,rr,drag.size)) continue;
      ctx.beginPath(); ctx.arc(px(cc),py(rr),4.5,0,Math.PI*2);
      ctx.fillStyle='rgba(52,211,153,.28)'; ctx.fill();
      ctx.beginPath(); ctx.arc(px(cc),py(rr),4.5,0,Math.PI*2);
      ctx.strokeStyle='rgba(52,211,153,.85)'; ctx.lineWidth=1.2; ctx.stroke();
    }
    ctx.restore();
  }

  // target ring pulse
  var tg = targetGear();
  if(tg && !level.free){
    var p = 0.5 + 0.5*Math.sin(now/420);
    ctx.beginPath(); ctx.arc(tg.x,tg.y,tg.rad+7+p*3,0,Math.PI*2);
    ctx.strokeStyle = won ? 'rgba(52,211,153,'+(0.35+p*0.4)+')' : 'rgba(251,191,36,'+(0.16+p*0.18)+')';
    ctx.lineWidth = 2; ctx.stroke();
  }

  for(i=0;i<gears.length;i++) drawGear(gears[i]);

  // drag preview on board
  if(drag && drag.peg){
    var pv = mkGear(drag.peg.c, drag.peg.r, drag.size);
    pv.w = null; pv.ang = now/900;
    ctx.save();
    ctx.globalAlpha = drag.ok ? 0.72 : 0.35;
    drawGear(pv);
    ctx.restore();
    ctx.beginPath(); ctx.arc(pv.x,pv.y,pv.rad+5,0,Math.PI*2);
    ctx.strokeStyle = drag.ok ? 'rgba(52,211,153,.9)' : 'rgba(239,68,68,.85)';
    ctx.setLineDash([5,5]); ctx.lineWidth=2; ctx.stroke(); ctx.setLineDash([]);
  }

  // crank label
  var ck = gears[0];
  ctx.save();
  ctx.font='700 10px ui-sans-serif,system-ui,sans-serif';
  ctx.textAlign='center'; ctx.fillStyle='rgba(110,231,183,.85)';
  ctx.fillText('CRANK ↻', ck.x, ck.y - ck.rad - 8);
  if(tg && !level.free){
    ctx.fillStyle='rgba(251,191,36,.9)';
    ctx.fillText('GOAL ' + arrowFor(level.dir) + ' ' + fmtRatio(goalMult()) + '×', tg.x, tg.y - tg.rad - 8);
  }
  ctx.restore();

  if(jam){
    ctx.save();
    ctx.font='800 15px ui-sans-serif,system-ui,sans-serif';
    ctx.textAlign='center';
    ctx.fillStyle='rgba(239,68,68,'+(0.55+0.45*Math.sin(now/180))+')';
    ctx.fillText('JAMMED — two paths fight each other', W/2, H-16);
    ctx.restore();
  }

  updateReadout();
  requestAnimationFrame(draw);
}

/* ---------- readout / chrome ---------- */
var elName=document.getElementById('lvlName'), elGoal=document.getElementById('goalVal'),
    elNow=document.getElementById('nowVal'), elHint=document.getElementById('hint'),
    elTray=document.getElementById('tray'), elDots=document.getElementById('dots'),
    elCount=document.getElementById('counter');

function updateReadout(){
  var t = targetGear();
  if(level.free){
    elNow.textContent = gears.length + ' cogs';
    elNow.className = 'val now';
    return;
  }
  if(jam){ elNow.textContent='jammed'; elNow.className='val now bad'; return; }
  if(!t || t.w===null){ elNow.textContent='stopped'; elNow.className='val now'; return; }
  var okDir = Math.sign(t.w)===level.dir;
  var okAll = okDir && Math.abs(Math.abs(t.w) - goalMult()) < 1e-6;
  elNow.textContent = arrowFor(Math.sign(t.w)) + ' ' + fmtRatio(t.w) + '×';
  elNow.className = 'val now ' + (okAll ? 'ok' : (okDir ? '' : 'bad'));
}

function chipCanvas(size){
  var c = document.createElement('canvas');
  c.width=76; c.height=76;
  var x = c.getContext('2d');
  var rad = 12 + size*7, teeth = teethOf(size), root=rad*0.80;
  var step=(Math.PI*2)/teeth;
  x.beginPath();
  for(var i=0;i<teeth;i++){
    var a=i*step;
    var pts=[[root,a-step*0.30],[rad,a-step*0.155],[rad,a+step*0.155],[root,a+step*0.30]];
    for(var k=0;k<4;k++){
      var xx=38+Math.cos(pts[k][1])*pts[k][0], yy=38+Math.sin(pts[k][1])*pts[k][0];
      if(i===0&&k===0) x.moveTo(xx,yy); else x.lineTo(xx,yy);
    }
    var na=(i+1)*step;
    x.lineTo(38+Math.cos(na-step*0.30)*root, 38+Math.sin(na-step*0.30)*root);
  }
  x.closePath();
  var g=x.createLinearGradient(38-rad,38-rad,38+rad,38+rad);
  g.addColorStop(0,'#f0cf92'); g.addColorStop(.55,'#cf9c3c'); g.addColorStop(1,'#7d5a15');
  x.fillStyle=g; x.fill();
  x.beginPath(); x.arc(38,38,rad*0.20,0,Math.PI*2); x.fillStyle='#121722'; x.fill();
  return c;
}

function buildTray(){
  elTray.innerHTML='';
  [1,2,3].forEach(function(s){
    var n = stock[s]||0;
    if(!level.free && (level.tray[s]||0)===0) return;
    var chip = document.createElement('div');
    chip.className='chip' + (n<=0?' empty':'');
    chip.appendChild(chipCanvas(s));
    var lab=document.createElement('div'); lab.className='n';
    lab.textContent = level.free ? teethOf(s)+'t' : (n + ' × ' + teethOf(s) + 't');
    chip.appendChild(lab);
    chip.addEventListener('pointerdown', function(e){ startDrag(e, s); });
    elTray.appendChild(chip);
  });
}

function buildDots(){
  elDots.innerHTML='';
  LEVELS.forEach(function(L,i){
    var b=document.createElement('button');
    b.className='dot'+(i===lvlIndex?' on':'')+(solved[i]?' done':'');
    b.textContent=(i+1);
    b.title=L.name;
    b.addEventListener('click',function(){ loadLevel(i); });
    elDots.appendChild(b);
  });
}

/* ---------- level loading ---------- */
function loadLevel(i){
  lvlIndex = i;
  level = LEVELS[i];
  startLevel();
}
function startFree(){
  lvlIndex = -1;
  level = FREE;
  startLevel();
}
function startLevel(){
  won = false; jam = false; drag = null; killGhost();
  gears = [];
  gears.push(mkGear(level.crank.c, level.crank.r, level.crank.s, 'crank'));
  if(level.target) gears.push(mkGear(level.target.c, level.target.r, level.target.s, 'target'));
  stock = {1:level.tray[1]||0, 2:level.tray[2]||0, 3:level.tray[3]||0};
  elName.textContent = level.name;
  elGoal.textContent = level.free ? '—' : (arrowFor(level.dir) + ' ' + fmtRatio(goalMult()) + '×');
  elHint.textContent = level.hint;
  elCount.textContent = level.free ? 'sandbox' : ('Puzzle ' + (lvlIndex+1) + ' of ' + LEVELS.length);
  document.getElementById('ov').classList.remove('on');
  buildTray(); buildDots();
  simulate();
}

function clearBoard(){
  var keep = [];
  for(var i=0;i<gears.length;i++){
    var g = gears[i];
    if(g.kind==='placed'){ if(!level.free) stock[g.s]++; }
    else keep.push(g);
  }
  gears = keep; won=false;
  document.getElementById('ov').classList.remove('on');
  buildTray(); simulate();
}

/* ---------- input ---------- */
function canvasPoint(e){
  var rect = cv.getBoundingClientRect();
  return { x: (e.clientX-rect.left) * (W/rect.width),
           y: (e.clientY-rect.top)  * (H/rect.height) };
}
function nearestPeg(p){
  var c = Math.round((p.x - M)/U), r = Math.round((p.y - M)/U);
  c = Math.max(0, Math.min(MAXC, c)); r = Math.max(0, Math.min(MAXR, r));
  return {c:c, r:r};
}

function makeGhost(size){
  killGhost();
  var el = chipCanvas(size);
  el.className='ghost';
  el.style.width = (radOf(size)*2*0.62)+'px';
  el.style.height = (radOf(size)*2*0.62)+'px';
  document.body.appendChild(el);
  ghostEl = el;
}
function killGhost(){ if(ghostEl && ghostEl.parentNode) ghostEl.parentNode.removeChild(ghostEl); ghostEl=null; }

function startDrag(e, size){
  if(!level.free && (stock[size]||0) <= 0) return;
  e.preventDefault();
  drag = { size:size, peg:null, ok:false };
  makeGhost(size);
  moveGhost(e.clientX, e.clientY);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
}
function moveGhost(x,y){ if(ghostEl){ ghostEl.style.left=x+'px'; ghostEl.style.top=y+'px'; } }

function onMove(e){
  if(!drag) return;
  e.preventDefault();
  moveGhost(e.clientX, e.clientY);
  var rect = cv.getBoundingClientRect();
  if(e.clientX>=rect.left-30 && e.clientX<=rect.right+30 && e.clientY>=rect.top-30 && e.clientY<=rect.bottom+30){
    var p = canvasPoint(e);
    var peg = nearestPeg(p);
    drag.peg = peg;
    drag.ok = canPlace(peg.c, peg.r, drag.size);
  } else {
    drag.peg = null; drag.ok = false;
  }
}
function onUp(e){
  window.removeEventListener('pointermove', onMove);
  window.removeEventListener('pointerup', onUp);
  window.removeEventListener('pointercancel', onUp);
  if(drag && drag.peg && drag.ok){
    gears.push(mkGear(drag.peg.c, drag.peg.r, drag.size, 'placed'));
    if(!level.free) stock[drag.size]--;
    buildTray(); simulate(); checkWin();
  }
  drag = null; killGhost();
}

cv.addEventListener('pointerdown', function(e){
  if(drag) return;
  var p = canvasPoint(e);
  for(var i=gears.length-1;i>=0;i--){
    var g = gears[i];
    if(g.kind!=='placed') continue;
    var dx=p.x-g.x, dy=p.y-g.y;
    if(dx*dx+dy*dy <= g.rad*g.rad){
      gears.splice(i,1);
      if(!level.free) stock[g.s]++;
      won=false;
      document.getElementById('ov').classList.remove('on');
      buildTray(); simulate();
      return;
    }
  }
});

/* ---------- win overlay ---------- */
function showWin(){
  var ov=document.getElementById('ov');
  document.getElementById('ovT').textContent = (lvlIndex===LEVELS.length-1) ? 'Machine complete!' : 'It turns!';
  var t = targetGear();
  document.getElementById('ovP').textContent =
    'Red wheel: ' + arrowFor(Math.sign(t.w)) + ' ' + fmtRatio(t.w) + '× the crank, through ' +
    (gears.filter(function(g){return g.kind==='placed';}).length) + ' cog' +
    ((gears.filter(function(g){return g.kind==='placed';}).length)===1?'':'s') + '.';
  var next = document.getElementById('ovNext');
  next.textContent = (lvlIndex===LEVELS.length-1) ? 'Free build →' : 'Next puzzle →';
  setTimeout(function(){ ov.classList.add('on'); }, 550);
}
document.getElementById('ovNext').addEventListener('click', function(){
  if(lvlIndex===LEVELS.length-1) startFree(); else loadLevel(lvlIndex+1);
});
document.getElementById('ovStay').addEventListener('click', function(){
  document.getElementById('ov').classList.remove('on');
});
document.getElementById('reset').addEventListener('click', clearBoard);
document.getElementById('free').addEventListener('click', startFree);

/* ---------- go ---------- */
loadLevel(0);
requestAnimationFrame(draw);
})();
</script>
</body>
