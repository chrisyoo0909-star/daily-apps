<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Plink — a marble machine that plays music</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#07070f;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    color:#e8e9f5;overscroll-behavior:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}

  header{display:flex;align-items:baseline;gap:10px;padding:10px 14px 6px;flex:0 0 auto}
  header h1{margin:0;font-size:17px;font-weight:650;letter-spacing:.02em}
  header h1 span{background:linear-gradient(90deg,#7df9ff,#b98bff 55%,#ff8fd0);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  header .hint{font-size:11.5px;color:#7b7d99;letter-spacing:.01em}

  #stagewrap{position:relative;flex:1 1 auto;min-height:0;margin:0 10px;border-radius:16px;overflow:hidden;
    background:radial-gradient(120% 90% at 50% 0%,#141433 0%,#0a0a18 55%,#06060e 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 10px 40px rgba(0,0,0,.5)}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  #tip{position:absolute;left:50%;top:14px;transform:translateX(-50%);pointer-events:none;
    font-size:12px;color:#9a9cc0;background:rgba(10,10,22,.72);border:1px solid rgba(255,255,255,.09);
    padding:6px 12px;border-radius:999px;white-space:nowrap;transition:opacity .5s;backdrop-filter:blur(6px)}

  #hud{position:absolute;right:10px;top:10px;font-size:11px;color:#6d6f8e;text-align:right;
    line-height:1.5;pointer-events:none;font-variant-numeric:tabular-nums}

  footer{flex:0 0 auto;padding:8px 10px calc(10px + env(safe-area-inset-bottom));display:flex;
    flex-direction:column;gap:7px}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .grow{flex:1 1 auto}

  button,select{font:inherit;color:#e8e9f5;background:#15162b;border:1px solid rgba(255,255,255,.10);
    border-radius:11px;padding:8px 11px;font-size:13px;cursor:pointer;transition:.14s;line-height:1}
  button:hover,select:hover{background:#1e2040;border-color:rgba(255,255,255,.2)}
  button:active{transform:scale(.96)}
  button.on{background:linear-gradient(180deg,#3a2f6e,#2a2158);border-color:#8f7bff;
    box-shadow:0 0 0 1px rgba(143,123,255,.35),0 0 16px rgba(143,123,255,.28)}
  select{padding:8px 8px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8b8db0 50%),linear-gradient(135deg,#8b8db0 50%,transparent 50%);
    background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px,5px 5px;
    background-repeat:no-repeat;padding-right:28px}
  .tool{min-width:60px;display:inline-flex;align-items:center;gap:5px;justify-content:center}
  .tool b{font-weight:600;font-size:12.5px}
  .ghost{background:transparent;border-color:rgba(255,255,255,.12);color:#a9abc8}

  .slider{display:flex;align-items:center;gap:7px;background:#101124;border:1px solid rgba(255,255,255,.08);
    border-radius:11px;padding:5px 11px;flex:1 1 130px;min-width:120px}
  .slider label{font-size:10.5px;color:#8688ab;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
  input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;flex:1;height:18px;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:#2e3057}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:#c3b6ff;margin-top:-6px;box-shadow:0 0 8px rgba(160,140,255,.7);cursor:pointer}
  input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:#2e3057}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:#c3b6ff;cursor:pointer}

  @media (max-width:560px){
    header{padding:8px 12px 4px}
    header h1{font-size:15px}
    header .hint{display:none}
    .tool{min-width:0;padding:8px 9px}
    .tool b{display:none}
    button,select{padding:8px 9px;font-size:12.5px}
    .slider{flex-basis:100px;min-width:96px;padding:4px 9px}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span>Plink</span></h1>
    <div class="hint">Draw pegs. Marbles fall. Every bounce is a note.</div>
  </header>

  <div id="stagewrap">
    <canvas id="c"></canvas>
    <div id="tip">Drag on the board to paint pegs — the marbles do the rest</div>
    <div id="hud"></div>
  </div>

  <footer>
    <div class="row">
      <button class="tool on" data-tool="peg" title="Paint pegs">⬤ <b>Peg</b></button>
      <button class="tool" data-tool="bar" title="Drag to draw a slanted bar">╱ <b>Bar</b></button>
      <button class="tool" data-tool="drop" title="Hold to pour marbles">💧 <b>Pour</b></button>
      <button class="tool" data-tool="erase" title="Drag to erase">🧽 <b>Erase</b></button>
      <span class="grow"></span>
      <select id="preset" title="Load a layout">
        <option value="">Layouts…</option>
        <option value="chandelier">Chandelier</option>
        <option value="staircase">Staircase</option>
        <option value="funnel">Funnel</option>
        <option value="rainforest">Rainforest</option>
        <option value="pachinko">Pachinko</option>
        <option value="random">Surprise me</option>
      </select>
      <button id="clear" class="ghost" title="Clear the board">Clear</button>
      <button id="mute" class="ghost" title="Mute">🔊</button>
    </div>
    <div class="row">
      <div class="slider"><label>Rain</label><input id="rate" type="range" min="0" max="100" value="42"></div>
      <div class="slider"><label>Bounce</label><input id="bounce" type="range" min="20" max="92" value="66"></div>
      <div class="slider"><label>Gravity</label><input id="grav" type="range" min="15" max="150" value="62"></div>
      <select id="scale" title="Musical scale">
        <option value="pentMaj">Pentatonic</option>
        <option value="pentMin">Minor Pent</option>
        <option value="hira">Japanese</option>
        <option value="lydian">Lydian</option>
        <option value="dorian">Dorian</option>
        <option value="blues">Blues</option>
      </select>
    </div>
  </footer>
</div>

<script>
(function () {
  "use strict";

  /* ---------- canvas ---------- */
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function resize() {
    var r = canvas.parentNode.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(120, r.width);
    H = Math.max(120, r.height);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', function () {
    var oldW = W, oldH = H;
    resize();
    if (oldW > 0 && oldH > 0 && (oldW !== W || oldH !== H)) {
      var sx = W / oldW, sy = H / oldH;
      pegs.forEach(function (p) { p.x *= sx; p.y *= sy; });
      bars.forEach(function (b) { b.x1 *= sx; b.y1 *= sy; b.x2 *= sx; b.y2 *= sy; });
      marbles.length = 0;
    }
  });

  /* ---------- audio ---------- */
  var AC = null, master = null, delayNode = null, muted = false;
  var voices = 0;

  function audio() {
    if (AC) return AC;
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    AC = new Ctor();
    master = AC.createGain();
    master.gain.value = 0.5;
    var comp = AC.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 8; comp.attack.value = 0.003; comp.release.value = 0.2;
    master.connect(comp); comp.connect(AC.destination);

    // simple stereo-ish feedback delay for air
    delayNode = AC.createDelay(1.0);
    delayNode.delayTime.value = 0.26;
    var fb = AC.createGain(); fb.gain.value = 0.30;
    var wet = AC.createGain(); wet.gain.value = 0.26;
    var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    delayNode.connect(lp); lp.connect(fb); fb.connect(delayNode);
    lp.connect(wet); wet.connect(comp);
    return AC;
  }
  function unlock() {
    var a = audio();
    if (a && a.state === 'suspended') a.resume();
  }

  var SCALES = {
    pentMaj: [0, 2, 4, 7, 9],
    pentMin: [0, 3, 5, 7, 10],
    hira:    [0, 2, 3, 7, 8],
    lydian:  [0, 2, 4, 6, 7, 9, 11],
    dorian:  [0, 2, 3, 5, 7, 9, 10],
    blues:   [0, 3, 5, 6, 7, 10]
  };
  var scaleKey = 'pentMaj';
  var ROOT = 50; // D3-ish

  // y position -> scale degree index (top of board = high notes)
  function degreeFor(y) {
    var t = 1 - Math.min(1, Math.max(0, y / Math.max(1, H)));
    var steps = SCALES[scaleKey].length * 3; // three octaves
    return Math.min(steps - 1, Math.floor(t * steps));
  }
  function midiFor(deg) {
    var s = SCALES[scaleKey], n = s.length;
    return ROOT + s[deg % n] + 12 * Math.floor(deg / n);
  }
  function freqOf(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }

  function play(midi, gain, kind) {
    if (muted) return;
    var a = audio();
    if (!a || a.state !== 'running') return;
    if (voices > 22) return;
    voices++;
    var t = a.currentTime;
    var f = freqOf(midi);
    var out = a.createGain();
    var dur = kind === 'bar' ? 0.42 : 1.15;
    var peak = Math.max(0.02, Math.min(0.34, gain));

    out.gain.setValueAtTime(0.0001, t);
    out.gain.exponentialRampToValueAtTime(peak, t + 0.006);
    out.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    var filt = a.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(Math.min(11000, f * 7 + 900), t);
    filt.frequency.exponentialRampToValueAtTime(Math.max(300, f * 1.6), t + dur * 0.8);
    filt.Q.value = kind === 'bar' ? 1.6 : 0.7;

    var partials = kind === 'bar'
      ? [[1, 1.0, 'triangle'], [2.76, 0.22, 'sine'], [5.4, 0.08, 'sine']]   // wooden bar
      : [[1, 1.0, 'sine'], [2.01, 0.38, 'sine'], [3.0, 0.14, 'triangle']];  // glass bell

    for (var i = 0; i < partials.length; i++) {
      var o = a.createOscillator();
      o.type = partials[i][2];
      o.frequency.setValueAtTime(f * partials[i][0], t);
      var g = a.createGain();
      g.gain.value = partials[i][1];
      o.connect(g); g.connect(filt);
      o.start(t);
      o.stop(t + dur + 0.05);
    }
    filt.connect(out);
    out.connect(master);
    if (delayNode) out.connect(delayNode);
    setTimeout(function () { voices--; try { out.disconnect(); } catch (e) {} }, (dur + 0.1) * 1000);
  }

  /* ---------- world ---------- */
  var pegs = [];      // {x,y,r,lit,deg}
  var bars = [];      // {x1,y1,x2,y2,lit,deg}
  var marbles = [];   // {x,y,vx,vy,r,hue,trail[]}
  var sparks = [];    // {x,y,vx,vy,life,hue}

  var MAX_MARBLES = 140;
  var PEG_R = 9;
  var MARBLE_R = 5.5;
  var BAR_T = 5;

  var params = { rate: 0.42, bounce: 0.66, gravity: 620 };
  var spoutX = 0.5, spoutSpread = 0.34;

  function hueFor(deg) {
    var span = SCALES[scaleKey].length * 3;
    return (200 + (deg / span) * 190) % 360;
  }

  function addPeg(x, y) {
    if (!isFinite(x) || !isFinite(y)) return false;
    x = Math.min(W - PEG_R - 2, Math.max(PEG_R + 2, x));
    y = Math.min(H - PEG_R - 2, Math.max(PEG_R + 2, y));
    for (var i = 0; i < pegs.length; i++) {
      var dx = pegs[i].x - x, dy = pegs[i].y - y;
      if (dx * dx + dy * dy < (PEG_R * 2.05) * (PEG_R * 2.05)) return false;
    }
    if (pegs.length > 400) return false;
    pegs.push({ x: x, y: y, r: PEG_R, lit: 0, deg: degreeFor(y) });
    return true;
  }
  function addBar(x1, y1, x2, y2) {
    if (!isFinite(x1) || !isFinite(y1) || !isFinite(x2) || !isFinite(y2)) return false;
    x1 = Math.min(W, Math.max(0, x1)); x2 = Math.min(W, Math.max(0, x2));
    y1 = Math.min(H, Math.max(0, y1)); y2 = Math.min(H, Math.max(0, y2));
    var dx = x2 - x1, dy = y2 - y1;
    if (dx * dx + dy * dy < 260) return false;
    if (bars.length > 90) return false;
    bars.push({ x1: x1, y1: y1, x2: x2, y2: y2, lit: 0, deg: degreeFor((y1 + y2) / 2) });
    return true;
  }
  function reDegree() {
    pegs.forEach(function (p) { p.deg = degreeFor(p.y); });
    bars.forEach(function (b) { b.deg = degreeFor((b.y1 + b.y2) / 2); });
  }

  function spawnMarble(x, y) {
    if (marbles.length >= MAX_MARBLES) marbles.shift();
    marbles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 26,
      vy: 12 + Math.random() * 18,
      r: MARBLE_R,
      hue: 190 + Math.random() * 160,
      trail: []
    });
  }

  function burst(x, y, hue, n, power) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, s = (0.4 + Math.random()) * power;
      sparks.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, hue: hue });
    }
  }

  /* ---------- collision helpers ---------- */
  function reflect(m, nx, ny, rest) {
    var vn = m.vx * nx + m.vy * ny;
    if (vn > 0) return 0;                      // already separating
    var speed = Math.abs(vn);
    m.vx -= (1 + rest) * vn * nx;
    m.vy -= (1 + rest) * vn * ny;
    // tiny jitter keeps the music from locking into a loop
    var ang = (Math.random() - 0.5) * 0.16;
    var ca = Math.cos(ang), sa = Math.sin(ang);
    var nvx = m.vx * ca - m.vy * sa;
    var nvy = m.vx * sa + m.vy * ca;
    m.vx = nvx; m.vy = nvy;
    return speed;
  }

  function step(dt) {
    var rest = params.bounce;
    var g = params.gravity;

    for (var i = marbles.length - 1; i >= 0; i--) {
      var m = marbles[i];
      m.vy += g * dt;
      // drag + terminal velocity keep things stable
      var sp = Math.hypot(m.vx, m.vy);
      var TV = 720;
      if (sp > TV) { m.vx *= TV / sp; m.vy *= TV / sp; }
      m.x += m.vx * dt;
      m.y += m.vy * dt;

      // walls
      if (m.x < m.r) { m.x = m.r; m.vx = Math.abs(m.vx) * rest; }
      if (m.x > W - m.r) { m.x = W - m.r; m.vx = -Math.abs(m.vx) * rest; }

      // pegs
      for (var p = 0; p < pegs.length; p++) {
        var pg = pegs[p];
        var dx = m.x - pg.x, dy = m.y - pg.y;
        var rr = pg.r + m.r;
        var d2 = dx * dx + dy * dy;
        if (d2 < rr * rr) {
          var d = Math.sqrt(d2) || 0.0001;
          var nx = dx / d, ny = dy / d;
          m.x = pg.x + nx * rr;
          m.y = pg.y + ny * rr;
          var hit = reflect(m, nx, ny, rest);
          if (hit > 26) {
            pg.lit = 1;
            play(midiFor(pg.deg), Math.min(0.3, 0.035 + hit / 2600), 'peg');
            burst(pg.x + nx * pg.r, pg.y + ny * pg.r, hueFor(pg.deg), 4, Math.min(3, hit / 90));
          }
        }
      }

      // bars
      for (var b = 0; b < bars.length; b++) {
        var br = bars[b];
        var ex = br.x2 - br.x1, ey = br.y2 - br.y1;
        var len2 = ex * ex + ey * ey || 1;
        var t = ((m.x - br.x1) * ex + (m.y - br.y1) * ey) / len2;
        t = t < 0 ? 0 : (t > 1 ? 1 : t);
        var cx = br.x1 + ex * t, cy = br.y1 + ey * t;
        var bx = m.x - cx, by = m.y - cy;
        var brr = m.r + BAR_T;
        var bd2 = bx * bx + by * by;
        if (bd2 < brr * brr) {
          var bd = Math.sqrt(bd2) || 0.0001;
          var bnx = bx / bd, bny = by / bd;
          m.x = cx + bnx * brr;
          m.y = cy + bny * brr;
          var bh = reflect(m, bnx, bny, rest * 0.92);
          if (bh > 24) {
            br.lit = 1;
            play(midiFor(br.deg), Math.min(0.28, 0.03 + bh / 2900), 'bar');
            burst(cx + bnx * BAR_T, cy + bny * BAR_T, hueFor(br.deg), 3, Math.min(3, bh / 100));
          }
        }
      }

      // trail
      m.trail.push(m.x, m.y);
      if (m.trail.length > 14) m.trail.splice(0, 2);

      // exit
      if (m.y > H + 30) {
        burst(m.x, H - 2, m.hue, 6, 1.6);
        marbles.splice(i, 1);
      }
    }
  }

  /* ---------- render ---------- */
  function draw(dt) {
    ctx.clearRect(0, 0, W, H);

    // floor glow
    var fg = ctx.createLinearGradient(0, H - 70, 0, H);
    fg.addColorStop(0, 'rgba(120,110,255,0)');
    fg.addColorStop(1, 'rgba(120,110,255,.10)');
    ctx.fillStyle = fg;
    ctx.fillRect(0, H - 70, W, 70);

    // spout
    var sx = spoutX * W;
    ctx.strokeStyle = 'rgba(180,175,255,.28)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sx - spoutSpread * W * 0.5, 3);
    ctx.lineTo(sx + spoutSpread * W * 0.5, 3);
    ctx.stroke();

    // bars
    ctx.lineCap = 'round';
    for (var b = 0; b < bars.length; b++) {
      var br = bars[b];
      var hue = hueFor(br.deg);
      ctx.lineWidth = BAR_T * 2;
      ctx.strokeStyle = 'hsla(' + hue + ',65%,' + (44 + br.lit * 34) + '%,' + (0.75 + br.lit * 0.25) + ')';
      ctx.shadowBlur = 6 + br.lit * 26;
      ctx.shadowColor = 'hsla(' + hue + ',95%,68%,' + (0.4 + br.lit * 0.6) + ')';
      ctx.beginPath(); ctx.moveTo(br.x1, br.y1); ctx.lineTo(br.x2, br.y2); ctx.stroke();
      br.lit = Math.max(0, br.lit - dt * 3.2);
    }

    // pegs
    for (var p = 0; p < pegs.length; p++) {
      var pg = pegs[p];
      var h = hueFor(pg.deg);
      var lit = pg.lit;
      ctx.shadowBlur = 8 + lit * 30;
      ctx.shadowColor = 'hsla(' + h + ',95%,70%,' + (0.45 + lit * 0.55) + ')';
      ctx.fillStyle = 'hsla(' + h + ',70%,' + (48 + lit * 36) + '%,' + (0.9) + ')';
      ctx.beginPath();
      ctx.arc(pg.x, pg.y, pg.r * (1 + lit * 0.22), 0, 6.2832);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.22 + lit * 0.6) + ')';
      ctx.beginPath();
      ctx.arc(pg.x - pg.r * 0.28, pg.y - pg.r * 0.3, pg.r * 0.3, 0, 6.2832);
      ctx.fill();
      pg.lit = Math.max(0, lit - dt * 3.0);
    }
    ctx.shadowBlur = 0;

    // marbles + trails
    for (var i = 0; i < marbles.length; i++) {
      var m = marbles[i];
      if (m.trail.length >= 4) {
        ctx.strokeStyle = 'hsla(' + m.hue + ',90%,72%,.20)';
        ctx.lineWidth = m.r * 1.1;
        ctx.beginPath();
        ctx.moveTo(m.trail[0], m.trail[1]);
        for (var k = 2; k < m.trail.length; k += 2) ctx.lineTo(m.trail[k], m.trail[k + 1]);
        ctx.stroke();
      }
      ctx.shadowBlur = 12;
      ctx.shadowColor = 'hsla(' + m.hue + ',95%,70%,.85)';
      var grd = ctx.createRadialGradient(m.x - m.r * 0.35, m.y - m.r * 0.4, 0.5, m.x, m.y, m.r);
      grd.addColorStop(0, '#ffffff');
      grd.addColorStop(0.45, 'hsl(' + m.hue + ',95%,78%)');
      grd.addColorStop(1, 'hsl(' + m.hue + ',80%,52%)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.2832); ctx.fill();
      ctx.shadowBlur = 0;
    }

    // sparks
    for (var s = sparks.length - 1; s >= 0; s--) {
      var sp = sparks[s];
      sp.x += sp.vx; sp.y += sp.vy; sp.vy += 0.09; sp.life -= dt * 2.1;
      if (sp.life <= 0) { sparks.splice(s, 1); continue; }
      ctx.fillStyle = 'hsla(' + sp.hue + ',95%,72%,' + sp.life * 0.85 + ')';
      ctx.fillRect(sp.x - 1.2, sp.y - 1.2, 2.4, 2.4);
    }

    // pending bar preview
    if (drag.active && tool === 'bar') {
      ctx.setLineDash([5, 5]);
      ctx.lineWidth = BAR_T * 2;
      ctx.strokeStyle = 'rgba(200,190,255,.5)';
      ctx.beginPath(); ctx.moveTo(drag.x0, drag.y0); ctx.lineTo(drag.x, drag.y); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (drag.active && tool === 'erase') {
      ctx.strokeStyle = 'rgba(255,120,150,.7)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(drag.x, drag.y, 26, 0, 6.2832); ctx.stroke();
    }
  }

  /* ---------- loop ---------- */
  var last = 0, dropAcc = 0;
  var hud = document.getElementById('hud');
  var hudAcc = 0;

  function frame(ts) {
    if (!last) last = ts;
    var dt = Math.min(0.033, (ts - last) / 1000);
    last = ts;

    // rain
    if (params.rate > 0.005) {
      dropAcc += dt * (params.rate * 14);
      while (dropAcc >= 1) {
        dropAcc -= 1;
        var x = (spoutX + (Math.random() - 0.5) * spoutSpread) * W;
        spawnMarble(Math.min(W - 10, Math.max(10, x)), -6);
      }
    }
    if (pouring) {
      pourAcc += dt * 22;
      while (pourAcc >= 1) { pourAcc -= 1; spawnMarble(drag.x, drag.y); }
    }

    // fixed-ish substeps for stable collisions
    var sub = 3, sdt = dt / sub;
    for (var i = 0; i < sub; i++) step(sdt);

    draw(dt);

    hudAcc += dt;
    if (hudAcc > 0.25) {
      hudAcc = 0;
      hud.textContent = marbles.length + ' marbles · ' + pegs.length + ' pegs' + (bars.length ? ' · ' + bars.length + ' bars' : '');
    }
    requestAnimationFrame(frame);
  }

  /* ---------- input ---------- */
  var tool = 'peg';
  var drag = { active: false, x0: 0, y0: 0, x: 0, y: 0, lastPaintX: 0, lastPaintY: 0 };
  var pouring = false, pourAcc = 0;
  var tipEl = document.getElementById('tip');
  var tipHidden = false;

  function hideTip() {
    if (tipHidden) return;
    tipHidden = true;
    tipEl.style.opacity = '0';
    setTimeout(function () { tipEl.style.display = 'none'; }, 600);
  }

  function pos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function eraseAt(x, y) {
    for (var i = pegs.length - 1; i >= 0; i--) {
      var dx = pegs[i].x - x, dy = pegs[i].y - y;
      if (dx * dx + dy * dy < 26 * 26) { burst(pegs[i].x, pegs[i].y, 350, 5, 1.4); pegs.splice(i, 1); }
    }
    for (var b = bars.length - 1; b >= 0; b--) {
      var br = bars[b];
      var ex = br.x2 - br.x1, ey = br.y2 - br.y1;
      var len2 = ex * ex + ey * ey || 1;
      var t = ((x - br.x1) * ex + (y - br.y1) * ey) / len2;
      t = t < 0 ? 0 : (t > 1 ? 1 : t);
      var cx = br.x1 + ex * t, cy = br.y1 + ey * t;
      if ((x - cx) * (x - cx) + (y - cy) * (y - cy) < 26 * 26) { burst(cx, cy, 350, 5, 1.4); bars.splice(b, 1); }
    }
  }

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    unlock();
    hideTip();
    canvas.setPointerCapture(e.pointerId);
    var p = pos(e);
    drag.active = true; drag.x0 = p.x; drag.y0 = p.y; drag.x = p.x; drag.y = p.y;
    drag.lastPaintX = p.x; drag.lastPaintY = p.y;

    if (tool === 'peg') addPeg(p.x, p.y);
    else if (tool === 'erase') eraseAt(p.x, p.y);
    else if (tool === 'drop') { pouring = true; spawnMarble(p.x, p.y); }
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!drag.active) return;
    var p = pos(e);
    drag.x = p.x; drag.y = p.y;
    if (tool === 'peg') {
      var dx = p.x - drag.lastPaintX, dy = p.y - drag.lastPaintY;
      if (dx * dx + dy * dy > (PEG_R * 2.4) * (PEG_R * 2.4)) {
        if (addPeg(p.x, p.y)) { drag.lastPaintX = p.x; drag.lastPaintY = p.y; }
        else { drag.lastPaintX = p.x; drag.lastPaintY = p.y; }
      }
    } else if (tool === 'erase') {
      eraseAt(p.x, p.y);
    }
  });

  function endDrag(e) {
    if (!drag.active) return;
    var p = pos(e);
    if (tool === 'bar') addBar(drag.x0, drag.y0, p.x, p.y);
    drag.active = false;
    pouring = false;
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', function (e) { drag.active = false; pouring = false; });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // tools
  var toolBtns = document.querySelectorAll('.tool');
  Array.prototype.forEach.call(toolBtns, function (btn) {
    btn.addEventListener('click', function () {
      unlock();
      tool = btn.getAttribute('data-tool');
      Array.prototype.forEach.call(toolBtns, function (b) { b.classList.toggle('on', b === btn); });
    });
  });

  document.getElementById('rate').addEventListener('input', function () { params.rate = this.value / 100; unlock(); });
  document.getElementById('bounce').addEventListener('input', function () { params.bounce = this.value / 100; });
  document.getElementById('grav').addEventListener('input', function () { params.gravity = this.value * 10; });
  document.getElementById('scale').addEventListener('change', function () { scaleKey = this.value; reDegree(); unlock(); });

  var muteBtn = document.getElementById('mute');
  muteBtn.addEventListener('click', function () {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    muteBtn.classList.toggle('on', muted);
    unlock();
  });

  document.getElementById('clear').addEventListener('click', function () {
    pegs.length = 0; bars.length = 0; marbles.length = 0;
    unlock();
  });

  document.getElementById('preset').addEventListener('change', function () {
    var v = this.value;
    if (v) { loadPreset(v); this.value = ''; }
    unlock();
  });

  /* ---------- presets ---------- */
  function loadPreset(name) {
    pegs.length = 0; bars.length = 0; marbles.length = 0;
    var w = W, h = H;
    var i, j, x, y;

    if (name === 'chandelier') {
      var rows = 7;
      for (i = 0; i < rows; i++) {
        var n = 3 + i * 2;
        y = h * 0.14 + i * (h * 0.72 / (rows - 1));
        var spread = w * (0.10 + i * 0.062);
        for (j = 0; j < n; j++) {
          x = w / 2 + (j - (n - 1) / 2) * (spread / Math.max(1, (n - 1) / 2)) * 0.5;
          addPeg(x, y);
        }
      }
      addBar(w * 0.06, h * 0.92, w * 0.34, h * 0.99);
      addBar(w * 0.94, h * 0.92, w * 0.66, h * 0.99);
    } else if (name === 'staircase') {
      var steps = 8;
      for (i = 0; i < steps; i++) {
        var left = i % 2 === 0;
        var yy = h * 0.12 + i * (h * 0.80 / steps);
        var x1 = left ? w * 0.06 : w * 0.94;
        var x2 = left ? w * 0.62 : w * 0.38;
        addBar(x1, yy, x2, yy + h * 0.055);
        for (j = 0; j < 4; j++) {
          addPeg(x1 + (x2 - x1) * (0.18 + j * 0.22), yy + h * 0.055 * (0.18 + j * 0.22) - 22);
        }
      }
    } else if (name === 'funnel') {
      for (i = 0; i < 3; i++) {
        var top = h * (0.12 + i * 0.29);
        addBar(w * 0.02, top, w * 0.42, top + h * 0.14);
        addBar(w * 0.98, top, w * 0.58, top + h * 0.14);
        for (j = 0; j < 5; j++) addPeg(w * (0.32 + j * 0.09), top + h * 0.19);
      }
    } else if (name === 'rainforest') {
      for (i = 0; i < 90; i++) {
        x = 24 + Math.random() * (w - 48);
        y = h * 0.10 + Math.random() * h * 0.84;
        addPeg(x, y);
      }
      for (i = 0; i < 5; i++) {
        var ax = Math.random() * w, ay = h * (0.2 + Math.random() * 0.6);
        var ang = (Math.random() - 0.5) * 1.1;
        addBar(ax, ay, ax + Math.cos(ang) * w * 0.28, ay + Math.sin(ang) * w * 0.28);
      }
    } else if (name === 'pachinko') {
      var R = 9, cols, sp = Math.max(34, Math.min(58, w / 11));
      for (i = 0; i < 12; i++) {
        y = h * 0.10 + i * (h * 0.82 / 11);
        var off = (i % 2) * sp / 2;
        cols = Math.floor((w - 20) / sp);
        for (j = 0; j <= cols; j++) {
          x = 14 + off + j * sp;
          if (x < w - 12) addPeg(x, y);
        }
      }
    } else { // random
      var kinds = Math.random();
      var count = 40 + Math.floor(Math.random() * 50);
      for (i = 0; i < count; i++) {
        if (kinds < 0.5) {
          // arcs
          var a = Math.random() * Math.PI;
          var rad = h * (0.14 + Math.random() * 0.34);
          addPeg(w / 2 + Math.cos(a) * rad, h * 0.45 + Math.sin(a) * rad * 0.8);
        } else {
          addPeg(20 + Math.random() * (w - 40), h * 0.10 + Math.random() * h * 0.82);
        }
      }
      var nb = 2 + Math.floor(Math.random() * 5);
      for (i = 0; i < nb; i++) {
        var bx = Math.random() * w * 0.7, by = h * (0.15 + Math.random() * 0.7);
        var bang = (Math.random() - 0.5) * 1.3;
        addBar(bx, by, bx + Math.cos(bang) * w * 0.3, by + Math.sin(bang) * w * 0.3);
      }
    }
    reDegree();
  }

  /* ---------- boot ---------- */
  resize();
  loadPreset('chandelier');
  requestAnimationFrame(frame);

  // first interaction anywhere unlocks audio
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (ev) {
    document.addEventListener(ev, unlock, { once: false, passive: true });
  });
  setTimeout(hideTip, 9000);
})();
</script>
</body>
</html>
