<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rungs — a word ladder puzzle</title>
<style>
:root{
  --bg:#0b0f1c; --panel:rgba(255,255,255,.045); --line:rgba(255,255,255,.09);
  --ink:#eef2ff; --dim:#8b95b5; --amber:#f6b73c; --teal:#48d3c3; --green:#6ee7a8; --rose:#ff7a8a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(900px 600px at 20% -10%, #1d2547 0%, transparent 60%),
    radial-gradient(700px 500px at 100% 110%, #2a1b3d 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  display:flex;justify-content:center;
  padding:14px 12px calc(14px + env(safe-area-inset-bottom));
  min-height:100%;
}
.wrap{width:100%;max-width:460px;display:flex;flex-direction:column;gap:12px}

header{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
h1{margin:0;font-size:26px;letter-spacing:.24em;font-weight:800;
   background:linear-gradient(92deg,var(--amber),#ffd98a 60%,var(--teal));
   -webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:11.5px;color:var(--dim);letter-spacing:.02em;text-align:right;line-height:1.3}

.bar{display:flex;gap:6px;align-items:center}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex:1}
.seg button{flex:1;border:0;background:transparent;color:var(--dim);font:600 12.5px/1 inherit;
  padding:8px 4px;border-radius:8px;cursor:pointer;letter-spacing:.04em}
.seg button.on{background:linear-gradient(180deg,rgba(246,183,60,.22),rgba(246,183,60,.1));color:var(--amber);
  box-shadow:inset 0 0 0 1px rgba(246,183,60,.35)}
.icon{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:11px;
  padding:9px 12px;font:600 12.5px/1 inherit;cursor:pointer;white-space:nowrap}
.icon:active{transform:translateY(1px)}
.icon[disabled]{opacity:.35;cursor:default}

.status{display:flex;gap:8px;font-size:12px;color:var(--dim);align-items:center;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 10px;
  display:flex;gap:6px;align-items:center}
.chip b{color:var(--ink);font-weight:700}
.chip.compass b{color:var(--teal)}
.spacer{flex:1}
.toggle{cursor:pointer;user-select:none}
.toggle.off{opacity:.5}

/* ladder */
.board{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  border:1px solid var(--line);border-radius:18px;padding:14px 10px;overflow:hidden}
.rails{position:absolute;inset:14px 18px;pointer-events:none}
.rails:before,.rails:after{content:"";position:absolute;top:0;bottom:0;width:2px;border-radius:2px;
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.13) 12%,rgba(255,255,255,.13) 88%,transparent)}
.rails:before{left:0}.rails:after{right:0}
.scroll{position:relative;max-height:46vh;min-height:190px;overflow-y:auto;scrollbar-width:thin;
  display:flex;flex-direction:column;align-items:center;gap:7px;padding:2px 8px}
.scroll::-webkit-scrollbar{width:6px}
.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:6px}

.row{display:flex;gap:6px;align-items:center;justify-content:center;position:relative}
.t{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;
  font:800 20px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em;
  background:#151b2e;border:1px solid var(--line);color:var(--ink);text-transform:uppercase}
.row.past .t{width:34px;height:34px;font-size:15px;background:rgba(255,255,255,.03);color:#9aa4c4;border-color:rgba(255,255,255,.06)}
.row.past .t.chg{color:var(--amber);border-color:rgba(246,183,60,.3);background:rgba(246,183,60,.07)}
.row.start .t{color:#c3cbe6}
.row.cur .t{width:52px;height:52px;font-size:24px;cursor:pointer;
  background:linear-gradient(180deg,#20283f,#171d2f);border-color:rgba(255,255,255,.16);
  box-shadow:0 6px 18px rgba(0,0,0,.35)}
.row.cur .t:hover{border-color:rgba(246,183,60,.5)}
.row.cur .t.sel{border-color:var(--amber);box-shadow:0 0 0 2px rgba(246,183,60,.28),0 6px 18px rgba(0,0,0,.35);
  background:linear-gradient(180deg,#2c2a20,#20222f)}
.row.cur .t.hintme{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(72,211,195,.0)}50%{box-shadow:0 0 0 5px rgba(72,211,195,.22)}}
.row.goal .t{background:rgba(72,211,195,.07);border:1px dashed rgba(72,211,195,.55);color:var(--teal);
  width:44px;height:44px;font-size:19px}
.row.win .t{background:linear-gradient(180deg,rgba(110,231,168,.25),rgba(110,231,168,.1));
  border-color:rgba(110,231,168,.6);color:#dcffe9}
.flip{animation:flip .34s ease}
@keyframes flip{0%{transform:rotateX(0)}45%{transform:rotateX(90deg) scale(.96)}100%{transform:rotateX(0)}}
.label{font-size:10px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin:2px 0 -2px}
.dots{color:rgba(255,255,255,.18);font-size:13px;letter-spacing:.3em;line-height:1}

/* picker */
.picker{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  border:1px solid var(--line);border-radius:16px;padding:11px 12px;min-height:96px}
.picker h2{margin:0 0 9px;font:600 12px/1.4 inherit;color:var(--dim);letter-spacing:.03em}
.picker h2 em{color:var(--amber);font-style:normal;font-weight:700}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{border:1px solid var(--line);background:#151b2e;color:var(--ink);border-radius:10px;
  padding:8px 9px;min-width:56px;cursor:pointer;text-align:center;
  font:700 13px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-transform:uppercase;letter-spacing:.06em}
.key small{display:block;font:600 8.5px/1 inherit;letter-spacing:.14em;color:var(--dim);margin-top:4px;text-transform:uppercase}
.key:hover{border-color:rgba(246,183,60,.45);background:#1b2237}
.key.used{opacity:.42}
.key.goal{border-color:rgba(110,231,168,.6);background:rgba(110,231,168,.12);color:#dcffe9}
.key.hint{border-color:var(--teal);box-shadow:0 0 0 2px rgba(72,211,195,.25)}
.empty{color:var(--dim);font-size:12.5px;padding:6px 2px}

footer{display:flex;gap:6px}
footer .icon{flex:1;text-align:center}
.hintline{font-size:11.5px;color:var(--dim);text-align:center;min-height:15px}
.hintline b{color:var(--teal)}

/* win overlay */
.ov{position:fixed;inset:0;background:rgba(6,9,18,.78);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:18px;z-index:9}
.ov.show{display:flex}
.card{width:100%;max-width:380px;background:linear-gradient(180deg,#161d33,#111627);
  border:1px solid var(--line);border-radius:20px;padding:20px;text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.55);animation:pop .3s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.card .rank{font:800 22px/1 inherit;letter-spacing:.02em;margin-bottom:6px}
.card p{margin:0 0 12px;color:var(--dim);font-size:13px}
.pathline{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:12px 0 16px}
.pw{font:700 12px/1 ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em;
  background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;padding:6px 7px;color:#cfd6ee}
.pw.hi{color:var(--green);border-color:rgba(110,231,168,.45)}
.big{width:100%;border:0;border-radius:12px;padding:13px;cursor:pointer;
  font:700 14px/1 inherit;letter-spacing:.04em;color:#1a1406;
  background:linear-gradient(180deg,#ffd071,var(--amber))}
.mini{margin-top:9px;background:none;border:0;color:var(--dim);font:600 12px/1 inherit;cursor:pointer;text-decoration:underline}
@media (max-width:360px){.t{width:40px;height:40px}.row.cur .t{width:47px;height:47px;font-size:21px}.key{min-width:50px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>RUNGS</h1>
    <div class="tag">change one letter at a time<br>every step must be a real word</div>
  </header>

  <div class="bar">
    <div class="seg" id="diff">
      <button data-d="0" class="on">EASY</button>
      <button data-d="1">MEDIUM</button>
      <button data-d="2">HARD</button>
    </div>
    <button class="icon" id="newBtn">New</button>
  </div>

  <div class="status">
    <div class="chip">moves <b id="mv">0</b><span style="color:var(--dim)">/ par <b id="par">0</b></span></div>
    <div class="chip compass toggle" id="compass">best case <b id="left">–</b></div>
    <div class="spacer"></div>
    <div class="chip" id="streakChip">solved <b id="streak">0</b></div>
  </div>

  <div class="board">
    <div class="rails"></div>
    <div class="scroll" id="ladder"></div>
  </div>

  <div class="picker">
    <h2 id="ptitle">Tap a letter above to change it.</h2>
    <div class="keys" id="keys"></div>
  </div>

  <div class="hintline" id="msg"></div>

  <footer>
    <button class="icon" id="undoBtn">↶ Undo</button>
    <button class="icon" id="hintBtn">Hint</button>
    <button class="icon" id="restartBtn">Restart</button>
    <button class="icon" id="solveBtn">Solve</button>
  </footer>
</div>

<div class="ov" id="ov"><div class="card">
  <div class="rank" id="rank"></div>
  <p id="sub"></p>
  <div class="pathline" id="path"></div>
  <button class="big" id="nextBtn">Next puzzle →</button>
  <button class="mini" id="closeBtn">keep looking at it</button>
</div></div>

<script>
(function(){
"use strict";
var WORDS = "acidaeroaideakinamidareaariaaridatomatopauntavidawaybabababebabybachbackbailbaitbakebaldbaleballbandbangbankbarbbardbarebarkbarnbasebashbassbathbeadbeakbeambeanbearbeatbeaubeckbeefbeenbeepbeerbellbeltbendbentbestbetabikebillbindbirdbiteblewblocblogblowblueblurboarboatboilboldboltbombbondbonebongboobbookboomboonbootborebornbossbothboutbowlbradbragbranbratbraybredbrewbrigbritbrowbuckbulbbulkbullbumpbunkburnburrburybushbustbusycafecagecaincakecalfcallcalmcamecampcanecantcapecaptcardcarecarlcartcasacasecashcastcavecellcentchadchapcharchatchefchemchewchicchinchipchopchowcitecitycladclanclapclawclayclipclubcluecoalcoatcocacococodecoilcoincokecolacoldcolecoltcomacombcomecommcompconeconnconscookcoolcoopcopecopycordcorecorkcorncorpcostcoupcovecozycrabcrewcribcropcrowcubecultcurbcurecurlcutedaftdaledamedampdangdaredarkdarndartdashdatadatedawndeaddeafdealdeandeardebtdeckdecodeeddeemdeepdeerdefydelidelldemodentdenydeskdialdicedietdimedinedingdiredirkdirtdiscdishdiskdivadivedockdoledolldomedonedongdoomdoordopedoradormdosedovedowndragdrawdrewdripdropdrugdrumdualduckductdudeduelduetdukedulldulydumbdumpdunkduskdustdutydyeddyereachearlearneaseeasteasyelsefacefactfadefailfairfakefallfamefangfarefarmfastfatefauxfearfeatfeedfeelfeetfellfeltfestfeudfiatfifefilefillfilmfindfinefirefirmfishfistfiveflagflapflatflawfleafleeflewflexflipflopflowfluxfoamfoilfoldfolkfondfontfoodfoolfootfordforeforkformfortfoulfourfreefrogfromfuelfullfundfunkfuryfusefussgagagaingalagalegallgameganggaspgategavegazegeargeekgenegiftgillgirlgivegladgleeglenglowgluegoalgoatgoldgolfgonegonggoodgoregoshgovtgowngrabgradgramgrangraygrewgridgrimgringripgritgrowgulfhackhailhairhalehalfhallhalohalthandhanghankhardhareharmharpharthashhatehaulhavehawkhazeheadhealheaphearheatheckheedheelheirheldhelmhelphempherbherdhereherohidehikehillhindhinthirehiveholdholeholtholyhomehonghoodhookhoophopehornhosehosthourhulkhullhumphunghunthurthushhypeitemjackjadejailjanejavajeanjeepjeezjessjilljockjohnjoinjokejoshjumpjunkjuryjustkalekeenkeepkentkeptkhankickkillkindkingkisskitekneeknewknitknobknotknowkylelacelacklaidlakelamalamblamelamplandlanelanglashlastlatelavalawnleadleafleakleanleapleftlendlenslentlesslicklifeliftlikelimblimelimolimplinelinglinklistliteliveloadloafloanlobelockloftlonelonglookloomlooplootlordloreloselosslostloudlovelucklumplunglurelushlustmacemademaidmailmainmakemalemallmaltmamamanemanymaramarcmaremarkmartmashmaskmassmastmatemayamayomazemeadmealmeanmeatmeekmeetmegameltmemememomendmenumeremesameshmessmetamicemickmidimikemildmilemilfmilkmillmilomindmineminimintmissmistmittmoanmockmodemojomoldmolemonkmonomoodmoonmoormoremossmostmothmovemuchmulemusemuskmustmutemythnailnamenearneatneckneedneonnerdnessnestnewsnextnicenickninenodenonenoonnopenormnosenotenounnudenullnumboathoatsouchpacepackpactpagepaidpainpairpalepalmpapaparaparkpartpasspastpathpawnpeakpearpeatpeckpeekpeelpeeppeerpestpickpierpikepilepillpimppinepingpinkpintpipepityplanplaypleaplotpoempoetpokepolepollpolopolypondpongponypoolpooppoorpopeporkpornportposeposhpostpourprayprepprespreyprobprofpromproppuckpullpulppumppunkpuntpurepushquadquidquitquizracerackraftrageraidrailrainrakeramprandrangrankrantraperarerashrateraverealreaprearreedreefreelreinrentrestricerichrickrideriffriftringrinkriotriperiseriskriteroadroamroarroberockroderolerollroofroomrootroperoseruderuinrulerushrustruthsacksafesagasagesaidsailsakesalesaltsamesandsanesangsanksanssavescamscanscarscumsealseamseatsectseedseekseemseenselfsellsendsentseptshahshamshawshedshesshinshipshoeshopshotshowshutsicksidesilksingsinksiresitesizeskinskipslabslamslapslayslewslidslimslipslitslotslowsnapsnowsoaksoapsoarsocksodasofasoftsoilsoldsolesolosomesongsoonsoresortsoulsoupsourspamspanspatspinspitspotspunspurstabstarstatstaystemstepstewstirstopstudstunsuchsucksuitsungsunksuresurfswamswanswapswatswayswimtacktacotailtaketaletalktalltametangtanktapetarttaskteamtearteentelltemptendtenstenttermtesttextthanthattheethemthentheythinthisthugthusticktidetidytiertiletilltilttimetingtinytiretoadtoldtolltombtonetonytooktooltoretorntosstourtowntramtraptraytreetrektreytrimtriotriptroytruetubetucktunatuneturfturntwintypetypovainvalevaryvasevastveilveinventverbveryvestvibevicevilevinevisavitavivavoltvotewadewagewaitwakewalkwallwandwantwardwarewarmwarnwarpwarywashwaspwattwaveweakwearweedweekweepweirweldwellwentwerewestwhatwhenwhipwickwidewifewildwillwindwinewingwinkwipewirewisewishwithwitswokewolfwombwontwoodwoolwordworeworkwormwornwrapwrityangyardyarnyeahyearyellyorkyourzerozonezoom".match(/.{4}/g);
var ENDS  = "acidareaawaybabybackballbandbangbankbasebathbearbeatbeenbeerbellbeltbestbikebillbirdbiteblogblowblueboatbombbondbonebookboombornbossbothbowlbullburnbushbusycakecallcalmcamecampcantcapecardcarecasecashcastcellcentchatchipcityclubcoalcoatcodecoldcomecookcoolcopycorecostcrewcurecutedaredarkdatadatedeaddealdeandeardebtdeckdeepdenydeskdietdonedoordowndrawdrewdropdrugdudedukedumbdustdutyeachearneaseeasteasyelsefacefactfailfairfakefallfamefarmfastfatefearfeedfeelfeetfellfeltfilefillfilmfindfinefirefirmfishfiveflagflatflowfoodfootfordformfortfourfreefromfuelfullfundgaingameganggategavegeargenegiftgirlgivegladgoalgoldgolfgonegoodgrabgraygrewgrowhairhalfhallhandhanghardharmhatehaveheadhearheatheldhelphereherohidehillhireholdholeholyhomehonghookhopehosthourhunthurtitemjackjailjanejeanjohnjoinjokejoshjumpjuryjustkeepkeptkickkillkindkingkisskneeknewknowlacklaidlakelandlanelastlateleadleftlesslifeliftlikelinelinklistliveloadloanlocklonglooklordloselosslostloudloveluckmademailmainmakemalemanymarkmaskmassmatemealmeanmeatmeetmessmikemilemilkmillmindmineminimissmodemoodmoonmoremostmovemuchmustnamenearneckneednewsnextnicenickninenonenosenotepacepackpagepaidpainpairparkpartpasspastpathpeakpickpinkplanplayplotpollpoolpoorpopepornportpostpraypullpurepushquitracerailrainrankraperareraterealrearrentrestricerichrickrideringriseriskroadrockrolerollroofroomrootroseruinrulerushsafesaidsakesalesaltsamesandsavesealseatseedseekseemseenselfsellsendsentseptshipshopshotshowshutsicksidesingsitesizeskinslowsnowsoftsoilsoldsolosomesongsoonsortsoulspinspotstarstaystemstepstopsuchsucksuitsuretailtaketalktalltanktapetaskteamtearteentelltendtermtesttextthanthatthemthentheythinthisthustilltimetinytoldtonetonytooktooltourtowntraptreetriptruetubeturntwintypevastveryvicevotewagewaitwakewalkwallwantwardwarmwashwaveweakwearweekwellwentwerewestwhatwhenwidewifewildwillwindwinewingwirewisewishwithwolfwoodwordworkyardyeahyearyorkyourzerozone".match(/.{4}/g);
var SET = new Set(WORDS);

/* ---- neighbour graph (one letter apart) ---- */
var buckets = new Map();
WORDS.forEach(function(w){
  for(var i=0;i<4;i++){
    var k = w.slice(0,i)+"."+w.slice(i+1);
    if(!buckets.has(k)) buckets.set(k,[]);
    buckets.get(k).push(w);
  }
});
var NB = Object.create(null);
WORDS.forEach(function(w){
  var s = Object.create(null), out = [];
  for(var i=0;i<4;i++){
    var b = buckets.get(w.slice(0,i)+"."+w.slice(i+1));
    for(var j=0;j<b.length;j++){ var x=b[j]; if(x!==w && !s[x]){ s[x]=1; out.push(x); } }
  }
  NB[w] = out;
});
function bfs(src){
  var d = Object.create(null); d[src]=0;
  var q=[src], head=0;
  while(head<q.length){
    var u=q[head++], n=NB[u];
    for(var i=0;i<n.length;i++){ var v=n[i]; if(d[v]===undefined){ d[v]=d[u]+1; q.push(v); } }
  }
  return d;
}

/* ---- state ---- */
var RANGES = [[3,4],[5,6],[7,9]];
var diff = 0, streak = 0;
var start="", target="", par=0, dist=null, path=[], sel=-1, hints=0, hintTile=-1, hintLetter="", solvedShown=false, gaveUp=false;

var $ = function(id){ return document.getElementById(id); };
var ladder=$("ladder"), keys=$("keys"), ptitle=$("ptitle"), msg=$("msg"), ov=$("ov");
var compassOn = true;

function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

function makePuzzle(){
  var lo = RANGES[diff][0], hi = RANGES[diff][1];
  for(var t=0;t<400;t++){
    var s = pick(ENDS);
    var d = bfs(s);
    var cands = [];
    for(var i=0;i<ENDS.length;i++){
      var w = ENDS[i], k = d[w];
      if(k!==undefined && k>=lo && k<=hi) cands.push(w);
    }
    if(cands.length){
      start = s; target = pick(cands); dist = bfs(target); par = dist[start];
      path = [start]; sel = -1; hints = 0; hintTile = -1; hintLetter = ""; gaveUp = false; solvedShown=false;
      return;
    }
  }
  start="cold"; target="warm"; dist=bfs(target); par=dist[start]; path=[start];
}

function cur(){ return path[path.length-1]; }
function won(){ return cur()===target; }

/* ---- rendering ---- */
function tile(ch, cls){
  var e = document.createElement("div");
  e.className = "t" + (cls? " "+cls : "");
  e.textContent = ch;
  return e;
}
function render(flipIdx){
  ladder.innerHTML = "";
  var lab = document.createElement("div");
  lab.className="label"; lab.textContent="start";
  ladder.appendChild(lab);

  for(var r=0;r<path.length;r++){
    var isCur = (r===path.length-1);
    var row = document.createElement("div");
    row.className = "row " + (isCur ? "cur"+(won()?" win":"") : (r===0?"past start":"past"));
    for(var i=0;i<4;i++){
      var changed = r>0 && path[r][i]!==path[r-1][i];
      var t = tile(path[r][i], isCur ? (i===sel?"sel":"") + (i===hintTile?" hintme":"") : (changed?"chg":""));
      if(isCur){
        (function(idx){ t.addEventListener("click", function(){ select(idx); }); })(i);
        if(flipIdx===i) t.classList.add("flip");
      }
      row.appendChild(t);
    }
    ladder.appendChild(row);
  }

  if(!won()){
    var dots = document.createElement("div");
    dots.className="dots"; dots.textContent="• • •";
    ladder.appendChild(dots);
    var grow = document.createElement("div");
    grow.className="row goal";
    for(var j=0;j<4;j++) grow.appendChild(tile(target[j],""));
    ladder.appendChild(grow);
    var gl = document.createElement("div");
    gl.className="label"; gl.style.color="var(--teal)"; gl.textContent="target";
    ladder.appendChild(gl);
  }

  $("mv").textContent = path.length-1;
  $("par").textContent = par;
  var remaining = dist[cur()];
  $("left").textContent = compassOn ? (won()? "0" : remaining) : "··";
  $("compass").classList.toggle("off", !compassOn);
  $("streak").textContent = streak;
  $("undoBtn").disabled = path.length<2;
  $("hintBtn").disabled = won();
  $("solveBtn").disabled = won();
  ladder.scrollTop = ladder.scrollHeight;
  renderKeys();
}

function renderKeys(){
  keys.innerHTML = "";
  if(won()){
    ptitle.innerHTML = "Solved. <em>"+target.toUpperCase()+"</em> reached.";
    return;
  }
  if(sel<0){
    ptitle.textContent = "Tap a letter above to change it.";
    keys.innerHTML = '<div class="empty">Every rung must be a real 4-letter word — only legal swaps are offered.</div>';
    return;
  }
  var w = cur(), opts = [];
  for(var c=97;c<=122;c++){
    var ch = String.fromCharCode(c);
    if(ch===w[sel]) continue;
    var cand = w.slice(0,sel)+ch+w.slice(sel+1);
    if(SET.has(cand)) opts.push(cand);
  }
  ptitle.innerHTML = 'Swap letter <em>'+(sel+1)+'</em> of <em>'+w.toUpperCase()+'</em> →';
  if(!opts.length){
    keys.innerHTML = '<div class="empty">No real word comes from changing that letter. Try another position.</div>';
    return;
  }
  opts.forEach(function(cand){
    var b = document.createElement("button");
    b.className = "key";
    b.innerHTML = cand.toUpperCase().split("").map(function(ch,i){
      return i===sel ? '<span style="color:var(--amber)">'+ch+'</span>' : ch;
    }).join("");
    if(cand===target){ b.classList.add("goal"); b.innerHTML += "<small>target</small>"; }
    else if(path.indexOf(cand)>=0){ b.classList.add("used"); b.innerHTML += "<small>been here</small>"; }
    if(hintTile===sel && cand[sel]===hintLetter) b.classList.add("hint");
    b.addEventListener("click", function(){ play(cand); });
    keys.appendChild(b);
  });
}

/* ---- actions ---- */
function select(i){
  sel = (sel===i ? -1 : i);
  render();
}
function play(word){
  var w = cur(), idx = -1;
  for(var i=0;i<4;i++) if(w[i]!==word[i]) idx=i;
  path.push(word);
  hintTile = -1; hintLetter=""; msg.textContent="";
  if(word===target){ sel=-1; render(idx); finish(); }
  else { sel = -1; render(idx); }
}
function finish(){
  var moves = path.length-1;
  if(!gaveUp) streak++;
  $("streak").textContent = streak;
  var rank, colour;
  if(gaveUp){ rank="Path revealed"; colour="var(--dim)"; }
  else if(moves===par && hints===0){ rank="Perfect ladder"; colour="var(--green)"; }
  else if(moves===par){ rank="Par — with help"; colour="var(--teal)"; }
  else if(moves<=par+2){ rank="Nicely climbed"; colour="var(--amber)"; }
  else { rank="You made it"; colour="var(--amber)"; }
  $("rank").textContent = rank;
  $("rank").style.color = colour;
  $("sub").textContent = start.toUpperCase()+" → "+target.toUpperCase()+" in "+moves+
    " move"+(moves===1?"":"s")+" (par "+par+")"+(hints? ", "+hints+" hint"+(hints===1?"":"s") : "");
  var pl = $("path"); pl.innerHTML="";
  path.forEach(function(w,i){
    var e=document.createElement("span");
    e.className="pw"+(i===path.length-1?" hi":"");
    e.textContent=w;
    pl.appendChild(e);
  });
  setTimeout(function(){ ov.classList.add("show"); }, 420);
}
function hint(){
  if(won()) return;
  var w = cur(), best = null, n = NB[w];
  for(var i=0;i<n.length;i++){ if(dist[n[i]]===dist[w]-1){ best=n[i]; break; } }
  if(!best) return;
  for(var j=0;j<4;j++) if(best[j]!==w[j]){ hintTile=j; hintLetter=best[j]; sel=j; }
  hints++;
  msg.innerHTML = "Hint: letter <b>"+(hintTile+1)+"</b> is the one to move.";
  render();
}
function solveIt(){
  if(won()) return;
  gaveUp = true;
  var w = cur(), guard = 0;
  while(w!==target && guard++ < 40){
    var n = NB[w], nxt = null;
    for(var i=0;i<n.length;i++){ if(dist[n[i]]===dist[w]-1){ nxt=n[i]; break; } }
    if(!nxt) break;
    w = nxt; path.push(w);
  }
  sel=-1; hintTile=-1; render(); finish();
}
function newPuzzle(){
  ov.classList.remove("show");
  makePuzzle();
  msg.textContent="";
  render();
}

/* ---- wiring ---- */
$("diff").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  [].forEach.call(this.children, function(c){ c.classList.remove("on"); });
  b.classList.add("on");
  diff = +b.dataset.d;
  newPuzzle();
});
$("newBtn").addEventListener("click", newPuzzle);
$("nextBtn").addEventListener("click", newPuzzle);
$("closeBtn").addEventListener("click", function(){ ov.classList.remove("show"); });
$("undoBtn").addEventListener("click", function(){
  if(path.length<2) return;
  path.pop(); sel=-1; hintTile=-1; msg.textContent=""; render();
});
$("restartBtn").addEventListener("click", function(){
  path = [start]; sel=-1; hints=0; hintTile=-1; gaveUp=false; msg.textContent=""; render();
});
$("hintBtn").addEventListener("click", hint);
$("solveBtn").addEventListener("click", solveIt);
$("compass").addEventListener("click", function(){ compassOn=!compassOn; render(); });

document.addEventListener("keydown", function(e){
  if(ov.classList.contains("show")){
    if(e.key==="Enter"||e.key===" ") { e.preventDefault(); newPuzzle(); }
    return;
  }
  if(won()) return;
  if(e.key==="ArrowRight"){ sel = sel<0?0:(sel+1)%4; render(); e.preventDefault(); return; }
  if(e.key==="ArrowLeft"){ sel = sel<0?3:(sel+3)%4; render(); e.preventDefault(); return; }
  if(e.key==="Backspace"){ if(path.length>1){ path.pop(); sel=-1; hintTile=-1; render(); } e.preventDefault(); return; }
  if(e.key>="1"&&e.key<="4"){ select(+e.key-1); return; }
  if(/^[a-zA-Z]$/.test(e.key)){
    var ch = e.key.toLowerCase(), w = cur();
    if(sel>=0){
      var cand = w.slice(0,sel)+ch+w.slice(sel+1);
      if(SET.has(cand) && cand!==w) play(cand);
      else { msg.textContent = "“"+cand.toUpperCase()+"” isn't a word here."; setTimeout(function(){msg.textContent="";},1200); }
    } else {
      // no tile selected: find the single position where this letter makes a word
      var hits=[];
      for(var i=0;i<4;i++){
        if(w[i]===ch) continue;
        var c2 = w.slice(0,i)+ch+w.slice(i+1);
        if(SET.has(c2)) hits.push({i:i,w:c2});
      }
      if(hits.length===1) play(hits[0].w);
      else if(hits.length>1){ sel=hits[0].i; render(); }
    }
  }
});

newPuzzle();
})();
</script>
</body>
</html>
