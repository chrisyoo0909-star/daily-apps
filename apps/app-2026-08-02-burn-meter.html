<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Burn Meter — Live Meeting Cost Counter</title>
<style>
  :root{
    --bg1:#06110c;
    --bg2:#0b1f16;
    --green:#3ddc84;
    --green-dim:#1f8a52;
    --red:#ff5d5d;
    --card:#0f2419;
    --card-border:#1c3d2b;
    --text:#eafff2;
    --dim:#7fb99a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1) 70%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 60px;
  }
  .wrap{width:100%;max-width:560px;}
  header{text-align:center;margin-bottom:18px;}
  h1{
    font-size:26px;
    margin:0 0 4px;
    letter-spacing:0.5px;
    background:linear-gradient(90deg,#3ddc84,#8dffc0);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .sub{color:var(--dim);font-size:13px;margin:0;}

  .counter-card{
    background:linear-gradient(160deg,#0d2117,#0a1a12);
    border:1px solid var(--card-border);
    border-radius:20px;
    padding:28px 20px 22px;
    text-align:center;
    margin-bottom:16px;
    box-shadow:0 10px 40px -12px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.03);
    position:relative;
    overflow:hidden;
  }
  .counter-card::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 50% -10%, rgba(61,220,132,0.15), transparent 60%);
    pointer-events:none;
  }
  .cost{
    font-variant-numeric:tabular-nums;
    font-size:clamp(40px,12vw,64px);
    font-weight:700;
    letter-spacing:-1px;
    margin:6px 0 2px;
    text-shadow:0 0 30px rgba(61,220,132,0.35);
  }
  .cost.running{color:var(--green);}
  .cost.paused{color:#ffd76a;}
  .rate-line{color:var(--dim);font-size:13px;margin-bottom:14px;}
  .timer{
    font-variant-numeric:tabular-nums;
    font-size:15px;
    color:var(--dim);
    margin-bottom:18px;
    letter-spacing:1px;
  }
  .controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  button{
    font-family:inherit;
    border:none;
    cursor:pointer;
    border-radius:12px;
    font-weight:600;
    transition:transform 0.08s ease, filter 0.15s ease;
  }
  button:active{transform:scale(0.96);}
  .btn-main{
    padding:13px 30px;
    font-size:16px;
    background:linear-gradient(135deg,#3ddc84,#1f8a52);
    color:#04160c;
    box-shadow:0 6px 18px -6px rgba(61,220,132,0.6);
  }
  .btn-main.stop{
    background:linear-gradient(135deg,#ff8a5d,#e14c4c);
    color:#1a0a05;
    box-shadow:0 6px 18px -6px rgba(225,76,76,0.55);
  }
  .btn-reset{
    padding:13px 20px;
    font-size:14px;
    background:#132b1e;
    color:var(--dim);
    border:1px solid var(--card-border);
  }
  .fun-fact{
    min-height:20px;
    font-size:13.5px;
    color:#ffd76a;
    margin-top:14px;
    font-style:italic;
    opacity:0;
    transition:opacity 0.4s ease;
  }
  .fun-fact.show{opacity:1;}

  .section-title{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--dim);
    margin:22px 0 10px 4px;
  }

  .attendees{display:flex;flex-direction:column;gap:8px;}
  .attendee{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:12px;
    padding:9px 10px;
  }
  .attendee input[type="text"]{
    flex:1.3;
    min-width:0;
    background:transparent;
    border:none;
    color:var(--text);
    font-size:14px;
    padding:6px 4px;
    outline:none;
  }
  .salary-wrap{
    flex:1;
    display:flex;
    align-items:center;
    background:#0a1912;
    border-radius:8px;
    padding:0 8px;
  }
  .salary-wrap span{color:var(--dim);font-size:13px;}
  .attendee input[type="number"]{
    width:100%;
    background:transparent;
    border:none;
    color:var(--text);
    font-size:14px;
    padding:8px 4px;
    outline:none;
    -moz-appearance:textfield;
  }
  .attendee input[type="number"]::-webkit-outer-spin-button,
  .attendee input[type="number"]::-webkit-inner-spin-button{
    -webkit-appearance:none;margin:0;
  }
  .attendee .yr{color:var(--dim);font-size:11px;white-space:nowrap;}
  .remove-btn{
    background:none;
    color:#ff8a8a;
    font-size:18px;
    line-height:1;
    padding:4px 8px;
    border-radius:8px;
  }
  .remove-btn:hover{background:rgba(255,93,93,0.12);}

  .add-row{
    display:flex;
    gap:8px;
    margin-top:10px;
    flex-wrap:wrap;
  }
  .add-btn{
    flex:1;
    min-width:120px;
    padding:11px;
    background:#0f2419;
    border:1px dashed var(--card-border);
    color:var(--green);
    font-size:13.5px;
  }
  .add-btn:hover{background:#132b1e;}

  .presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
  .preset-chip{
    padding:6px 12px;
    background:#0a1912;
    border:1px solid var(--card-border);
    color:var(--dim);
    font-size:12px;
    border-radius:999px;
  }
  .preset-chip:hover{color:var(--green);border-color:var(--green-dim);}

  .total-line{
    text-align:center;
    color:var(--dim);
    font-size:12.5px;
    margin-top:6px;
  }
  footer{
    margin-top:28px;
    text-align:center;
    color:#3a5f4c;
    font-size:11.5px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔥 Burn Meter</h1>
    <p class="sub">Watch what this meeting actually costs — live.</p>
  </header>

  <div class="counter-card">
    <div class="cost paused" id="costDisplay">$0.00</div>
    <div class="rate-line" id="rateLine">$0.00 / hour combined</div>
    <div class="timer" id="timerDisplay">00:00:00</div>
    <div class="controls">
      <button class="btn-main" id="toggleBtn">▶ Start Meeting</button>
      <button class="btn-reset" id="resetBtn">Reset</button>
    </div>
    <div class="fun-fact" id="funFact"></div>
  </div>

  <div class="section-title">Attendees</div>
  <div class="attendees" id="attendeeList"></div>
  <div class="add-row">
    <button class="add-btn" id="addBtn">+ Add attendee</button>
  </div>
  <div class="presets">
    <button class="preset-chip" data-n="1">Solo focus block</button>
    <button class="preset-chip" data-n="3">3-person sync</button>
    <button class="preset-chip" data-n="6">6-person standup</button>
    <button class="preset-chip" data-n="10">10-person all-hands</button>
  </div>
  <div class="total-line" id="totalLine"></div>

  <footer>Assumes 2,080 working hours/year per person. All figures are estimates for fun &amp; awareness.</footer>
</div>

<script>
(function(){
  "use strict";

  var WORK_HOURS_PER_YEAR = 2080;

  var attendeeList = document.getElementById('attendeeList');
  var addBtn = document.getElementById('addBtn');
  var toggleBtn = document.getElementById('toggleBtn');
  var resetBtn = document.getElementById('resetBtn');
  var costDisplay = document.getElementById('costDisplay');
  var rateLine = document.getElementById('rateLine');
  var timerDisplay = document.getElementById('timerDisplay');
  var funFact = document.getElementById('funFact');
  var totalLine = document.getElementById('totalLine');

  var attendees = []; // {id, name, salary}
  var nextId = 1;

  var running = false;
  var accumulatedMs = 0;   // ms accumulated before current run segment
  var runStartTs = null;   // timestamp when current run segment started
  var rafHandle = null;

  var funFacts = [
    { at: 5,    text: "That's a fancy coffee, gone." },
    { at: 15,   text: "A footlong sandwich just burned." },
    { at: 40,   text: "That's a nice dinner for one." },
    { at: 100,  text: "You could've bought a decent pair of headphones." },
    { at: 250,  text: "That's a weekend flight, right there." },
    { at: 500,  text: "A new laptop is starting to look cheaper than this meeting." },
    { at: 1000, text: "Four figures. Someone should be taking notes at least." },
    { at: 2500, text: "This meeting now costs more than most monthly rents." },
    { at: 5000, text: "You could hire a freelancer for a month for this." },
    { at: 10000, text: "This is small-car money. Truly." }
  ];
  var lastFactAt = -1;

  function formatMoney(n){
    return '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function formatTime(ms){
    var totalSec = Math.floor(ms/1000);
    var h = Math.floor(totalSec/3600);
    var m = Math.floor((totalSec%3600)/60);
    var s = totalSec%60;
    function p(x){ return x<10 ? '0'+x : ''+x; }
    return p(h)+':'+p(m)+':'+p(s);
  }

  function totalHourlyRate(){
    var sum = 0;
    for (var i=0;i<attendees.length;i++){
      var sal = parseFloat(attendees[i].salary);
      if (!isFinite(sal) || sal < 0) sal = 0;
      sum += sal / WORK_HOURS_PER_YEAR;
    }
    return sum;
  }

  function renderAttendees(){
    attendeeList.innerHTML = '';
    for (var i=0;i<attendees.length;i++){
      (function(a){
        var row = document.createElement('div');
        row.className = 'attendee';

        var nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.placeholder = 'Name / role';
        nameInput.value = a.name;
        nameInput.addEventListener('input', function(){
          a.name = nameInput.value;
        });

        var salaryWrap = document.createElement('div');
        salaryWrap.className = 'salary-wrap';
        var dollar = document.createElement('span');
        dollar.textContent = '$';
        var salaryInput = document.createElement('input');
        salaryInput.type = 'number';
        salaryInput.min = '0';
        salaryInput.step = '1000';
        salaryInput.value = a.salary;
        salaryInput.addEventListener('input', function(){
          var v = parseFloat(salaryInput.value);
          a.salary = isFinite(v) && v >= 0 ? v : 0;
          updateStaticInfo();
        });
        var yr = document.createElement('span');
        yr.className = 'yr';
        yr.textContent = '/yr';
        salaryWrap.appendChild(dollar);
        salaryWrap.appendChild(salaryInput);
        salaryWrap.appendChild(yr);

        var removeBtn = document.createElement('button');
        removeBtn.className = 'remove-btn';
        removeBtn.textContent = '✕';
        removeBtn.addEventListener('click', function(){
          attendees = attendees.filter(function(x){ return x.id !== a.id; });
          renderAttendees();
          updateStaticInfo();
        });

        row.appendChild(nameInput);
        row.appendChild(salaryWrap);
        row.appendChild(removeBtn);
        attendeeList.appendChild(row);
      })(attendees[i]);
    }
    updateStaticInfo();
  }

  function updateStaticInfo(){
    var hourly = totalHourlyRate();
    rateLine.textContent = formatMoney(hourly) + ' / hour combined — ' + attendees.length + (attendees.length===1 ? ' person' : ' people');
    var perMinute = hourly/60;
    totalLine.textContent = attendees.length
      ? ('That\'s roughly ' + formatMoney(perMinute) + ' every minute this meeting runs.')
      : 'Add at least one attendee to start the meter.';
  }

  function addAttendee(name, salary){
    attendees.push({ id: nextId++, name: name || '', salary: (salary!=null ? salary : 90000) });
    renderAttendees();
  }

  function setPreset(n){
    attendees = [];
    nextId = 1;
    var sampleSalaries = [85000, 95000, 110000, 75000, 130000, 160000, 70000, 100000, 120000, 145000];
    for (var i=0;i<n;i++){
      addAttendeeSilent('', sampleSalaries[i % sampleSalaries.length]);
    }
    renderAttendees();
    resetTimer();
  }

  function addAttendeeSilent(name, salary){
    attendees.push({ id: nextId++, name: name || '', salary: salary });
  }

  function tick(){
    var elapsed = accumulatedMs + (running ? (Date.now() - runStartTs) : 0);
    var hourly = totalHourlyRate();
    var cost = (hourly / 3600000) * elapsed;

    costDisplay.textContent = formatMoney(cost);
    timerDisplay.textContent = formatTime(elapsed);

    var hit = null;
    for (var i=0;i<funFacts.length;i++){
      if (cost >= funFacts[i].at) hit = funFacts[i];
    }
    if (hit && hit.at !== lastFactAt){
      lastFactAt = hit.at;
      funFact.textContent = '💸 ' + hit.text;
      funFact.classList.add('show');
    } else if (!hit) {
      funFact.classList.remove('show');
    }

    if (running){
      rafHandle = requestAnimationFrame(tick);
    }
  }

  function startMeeting(){
    if (attendees.length === 0){
      addAttendee('', 90000);
    }
    running = true;
    runStartTs = Date.now();
    toggleBtn.textContent = '⏸ Stop Meeting';
    toggleBtn.classList.add('stop');
    costDisplay.classList.remove('paused');
    costDisplay.classList.add('running');
    tick();
  }

  function stopMeeting(){
    if (running){
      accumulatedMs += Date.now() - runStartTs;
    }
    running = false;
    runStartTs = null;
    if (rafHandle) cancelAnimationFrame(rafHandle);
    toggleBtn.textContent = '▶ Resume Meeting';
    toggleBtn.classList.remove('stop');
    costDisplay.classList.remove('running');
    costDisplay.classList.add('paused');
  }

  function resetTimer(){
    running = false;
    accumulatedMs = 0;
    runStartTs = null;
    lastFactAt = -1;
    if (rafHandle) cancelAnimationFrame(rafHandle);
    toggleBtn.textContent = '▶ Start Meeting';
    toggleBtn.classList.remove('stop');
    costDisplay.classList.remove('running');
    costDisplay.classList.add('paused');
    funFact.classList.remove('show');
    costDisplay.textContent = '$0.00';
    timerDisplay.textContent = '00:00:00';
  }

  toggleBtn.addEventListener('click', function(){
    if (running) stopMeeting(); else startMeeting();
  });

  resetBtn.addEventListener('click', resetTimer);

  addBtn.addEventListener('click', function(){
    addAttendee('', 90000);
  });

  var presetChips = document.querySelectorAll('.preset-chip');
  for (var i=0;i<presetChips.length;i++){
    presetChips[i].addEventListener('click', function(){
      var n = parseInt(this.getAttribute('data-n'), 10);
      setPreset(n);
    });
  }

  // initial state: 3-person sync
  setPreset(3);
})();
</script>
</body>
</html>
