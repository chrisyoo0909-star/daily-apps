<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lumen — Light the Targets</title>
<style>
  :root{
    --bg:#05060d; --panel:#0d1020; --edge:#1e2440; --ink:#e8ecff; --dim:#7d86ad;
    --gold:#ffd66b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:"Avenir Next","Segoe UI",Inter,system-ui,-apple-system,sans-serif;}
  body{
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:18px 14px 30px;
    background:
      radial-gradient(1000px 600px at 50% -10%, #16204a 0%, transparent 62%),
      radial-gradient(700px 500px at 100% 100%, #241436 0%, transparent 60%),
      var(--bg);
  }
  .wrap{width:100%; max-width:560px;}

  header{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:14px;}
  h1{
    margin:0; font-size:30px; letter-spacing:.32em; font-weight:700;
    background:linear-gradient(92deg,#ff6b8b,#ffd66b 32%,#5ce1b0 62%,#6aa8ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .tag{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim);}

  .bar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
    border:1px solid var(--edge); border-radius:14px; padding:10px 12px; margin-bottom:12px;
  }
  .lvl{font-size:12px; color:var(--dim); letter-spacing:.13em; text-transform:uppercase;}
  .name{font-size:17px; font-weight:650; margin-top:2px;}
  .moves{font-variant-numeric:tabular-nums; font-size:12px; color:var(--dim); letter-spacing:.08em;}

  .btns{display:flex; gap:8px;}
  button{
    font:inherit; font-size:13px; font-weight:600; color:var(--ink); cursor:pointer;
    background:rgba(255,255,255,.06); border:1px solid var(--edge);
    border-radius:10px; padding:9px 13px; transition:.16s;
  }
  button:hover:not(:disabled){background:rgba(255,255,255,.13); border-color:#39406b;}
  button:disabled{opacity:.3; cursor:default;}

  .stage{position:relative;}
  canvas{
    width:100%; display:block; border-radius:20px; touch-action:manipulation;
    background:linear-gradient(180deg,#0a0d1c,#070915);
    border:1px solid var(--edge);
    box-shadow:0 22px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
  }

  .hint{margin-top:11px; text-align:center; font-size:12.5px; color:var(--dim); min-height:17px; line-height:1.5;}

  .dots{display:flex; gap:6px; justify-content:center; margin-top:14px; flex-wrap:wrap;}
  .dot{
    width:26px; height:26px; border-radius:8px; border:1px solid var(--edge);
    background:rgba(255,255,255,.04); color:var(--dim);
    font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:.16s;
  }
  .dot.done{background:rgba(92,225,176,.16); border-color:#2f7f66; color:#8ff0cd;}
  .dot.cur{border-color:var(--gold); color:var(--gold); box-shadow:0 0 12px rgba(255,214,107,.32);}

  .win{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; border-radius:20px;
    background:rgba(5,7,16,.82); backdrop-filter:blur(7px);
    opacity:0; pointer-events:none; transition:.32s;
  }
  .win.show{opacity:1; pointer-events:auto;}
  .win h2{
    margin:0; font-size:28px; letter-spacing:.2em; font-weight:700;
    background:linear-gradient(92deg,#ffd66b,#5ce1b0);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .win p{margin:0; font-size:13px; color:var(--dim);}
  .win button{padding:12px 22px; font-size:14px; background:rgba(255,214,107,.14); border-color:#7a642c; color:#ffe8ab;}

  @media (max-width:430px){
    h1{font-size:24px; letter-spacing:.24em;}
    .name{font-size:15px;}
    button{padding:8px 11px; font-size:12px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>LUMEN</h1>
    <div class="tag">beam puzzle</div>
  </header>

  <div class="bar">
    <div>
      <div class="lvl" id="lvlNo">Level 1 of 10</div>
      <div class="name" id="lvlName">First Light</div>
    </div>
    <div style="text-align:right">
      <div class="moves" id="moves">0 TAPS</div>
      <div class="btns" style="margin-top:6px">
        <button id="prev">‹</button>
        <button id="reset">Reset</button>
        <button id="next">›</button>
      </div>
    </div>
  </div>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="win" id="win">
      <h2>SOLVED</h2>
      <p id="winSub">All targets lit.</p>
      <button id="cont">Next Level →</button>
    </div>
  </div>

  <div class="hint" id="hint">Tap a mirror to flip it. Light every target in its exact colour.</div>
  <div class="dots" id="dots"></div>
</div>

<script id="core">
/* ---------- LUMEN CORE (pure logic, no DOM) ---------- */
var DIRS = [[1,0],[0,1],[-1,0],[0,-1]]; // 0 right, 1 down, 2 left, 3 up

// o = 0 -> "/"  ,  o = 1 -> "\"
function reflect(d, o){
  return o === 0 ? [3,2,1,0][d] : [1,0,3,2][d];
}

var LEVELS = [
  { name:"First Light", hint:"Tap the mirror to flip it. Light every target in its exact colour.", w:7, h:7, cells:[
    {x:0,y:3,t:"emit",dir:0,color:1},
    {x:3,y:3,t:"mirror",o:1},
    {x:3,y:0,t:"target",color:1},
    {x:6,y:3,t:"wall"}
  ]},

  { name:"Around the Bend", hint:"Two mirrors, one path.", w:7, h:7, cells:[
    {x:0,y:1,t:"emit",dir:0,color:1},
    {x:5,y:1,t:"mirror",o:0},
    {x:5,y:5,t:"mirror",o:1},
    {x:0,y:5,t:"target",color:1},
    {x:6,y:1,t:"wall"},{x:6,y:5,t:"wall"},{x:0,y:3,t:"wall"}
  ]},

  { name:"Split Decision", hint:"A splitter (the double diamond) sends light two ways at once.", w:7, h:7, cells:[
    {x:0,y:5,t:"emit",dir:0,color:7},
    {x:2,y:5,t:"split",o:1},
    {x:2,y:1,t:"mirror",o:0},
    {x:0,y:1,t:"target",color:7},
    {x:6,y:5,t:"target",color:7},
    {x:2,y:6,t:"wall"},{x:4,y:1,t:"wall"}
  ]},

  { name:"Through the Glass", hint:"A filter strips light down to its own colour.", w:7, h:7, cells:[
    {x:0,y:3,t:"emit",dir:0,color:7},
    {x:3,y:3,t:"split",o:1},
    {x:3,y:1,t:"mirror",o:1},
    {x:5,y:1,t:"filter",color:1},
    {x:6,y:1,t:"target",color:1},
    {x:5,y:3,t:"filter",color:4},
    {x:6,y:3,t:"target",color:4},
    {x:3,y:0,t:"wall"},{x:3,y:5,t:"wall"},{x:1,y:1,t:"wall"}
  ]},

  { name:"Yellow Means Go", hint:"Red and green arriving at the same target make yellow.", w:7, h:7, cells:[
    {x:0,y:2,t:"emit",dir:0,color:1},
    {x:0,y:4,t:"emit",dir:0,color:2},
    {x:5,y:2,t:"mirror",o:0},
    {x:5,y:4,t:"mirror",o:1},
    {x:5,y:3,t:"target",color:3},
    {x:6,y:2,t:"wall"},{x:6,y:4,t:"wall"},{x:2,y:6,t:"wall"}
  ]},

  { name:"Crossfire", hint:"All three primaries together make white.", w:7, h:7, cells:[
    {x:0,y:0,t:"emit",dir:0,color:1},
    {x:0,y:6,t:"emit",dir:0,color:2},
    {x:6,y:0,t:"emit",dir:1,color:4},
    {x:3,y:0,t:"mirror",o:0},
    {x:3,y:6,t:"mirror",o:1},
    {x:6,y:3,t:"mirror",o:1},
    {x:3,y:3,t:"target",color:7},
    {x:6,y:6,t:"wall"},{x:0,y:3,t:"wall"}
  ]},

  { name:"The Long Way", hint:"Four bends. Only one route survives.", w:7, h:7, cells:[
    {x:0,y:0,t:"emit",dir:0,color:1},
    {x:6,y:0,t:"mirror",o:0},
    {x:6,y:3,t:"mirror",o:1},
    {x:1,y:3,t:"mirror",o:1},
    {x:1,y:5,t:"mirror",o:0},
    {x:6,y:5,t:"target",color:1},
    {x:0,y:5,t:"wall"},{x:1,y:6,t:"wall"},{x:4,y:1,t:"wall"},{x:3,y:4,t:"wall"}
  ]},

  { name:"Trichrome", hint:"One white beam. Three colours to deliver.", w:7, h:7, cells:[
    {x:0,y:6,t:"emit",dir:0,color:7},
    {x:2,y:6,t:"split",o:1},
    {x:4,y:6,t:"split",o:1},
    {x:2,y:4,t:"filter",color:1},
    {x:2,y:3,t:"target",color:1},
    {x:4,y:4,t:"filter",color:2},
    {x:4,y:3,t:"target",color:2},
    {x:5,y:6,t:"filter",color:4},
    {x:6,y:6,t:"target",color:4},
    {x:0,y:3,t:"wall"},{x:6,y:1,t:"wall"}
  ]},

  { name:"Doubling Back", hint:"", w:7, h:7, cells:[
    {x:0,y:0,t:"emit",dir:0,color:7},
    {x:4,y:0,t:"mirror",o:0},
    {x:4,y:4,t:"split",o:0},
    {x:5,y:4,t:"filter",color:1},
    {x:6,y:4,t:"target",color:1},
    {x:4,y:5,t:"filter",color:4},
    {x:4,y:6,t:"mirror",o:0},
    {x:1,y:6,t:"target",color:4},
    {x:6,y:0,t:"wall"},{x:0,y:4,t:"wall"},{x:2,y:2,t:"wall"}
  ]},

  { name:"Grand Circuit", hint:"The full workshop. Magenta, cyan and green all at once.", w:7, h:7, cells:[
    {x:0,y:3,t:"emit",dir:0,color:7},
    {x:2,y:3,t:"split",o:1},
    {x:2,y:1,t:"mirror",o:0},
    {x:1,y:1,t:"filter",color:5},
    {x:0,y:1,t:"target",color:5},
    {x:4,y:3,t:"split",o:0},
    {x:4,y:5,t:"mirror",o:1},
    {x:2,y:5,t:"filter",color:6},
    {x:1,y:5,t:"target",color:6},
    {x:5,y:3,t:"filter",color:2},
    {x:6,y:3,t:"target",color:2},
    {x:2,y:6,t:"wall"},{x:2,y:0,t:"wall"},{x:6,y:5,t:"wall"},{x:4,y:0,t:"wall"}
  ]}
];

// Assign a rotation index to every tappable piece.
function indexLevel(lv){
  var n = 0;
  lv.cells.forEach(function(c){
    if (c.t === "mirror" || c.t === "split"){ c.id = n++; }
  });
  lv.rotCount = n;
  lv.start = lv.cells.filter(function(c){ return c.id !== undefined; })
                     .sort(function(a,b){ return a.id - b.id; })
                     .map(function(c){ return c.o; });
  return lv;
}
LEVELS.forEach(indexLevel);

function simulate(lv, oris){
  var W = lv.w, H = lv.h;
  var grid = {};
  lv.cells.forEach(function(c){ grid[c.x + "," + c.y] = c; });

  var segs = [], acc = {}, seen = {}, q = [];
  lv.cells.forEach(function(c){
    if (c.t === "target") acc[c.x + "," + c.y] = 0;
    if (c.t === "emit") q.push({ x:c.x, y:c.y, d:c.dir, c:c.color });
  });

  var guard = 0;
  while (q.length && guard++ < 20000){
    var b = q.pop();
    var nx = b.x + DIRS[b.d][0], ny = b.y + DIRS[b.d][1];
    if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
    var key = nx + "," + ny + "," + b.d + "," + b.c;
    if (seen[key]) continue;
    seen[key] = 1;
    segs.push({ x1:b.x, y1:b.y, x2:nx, y2:ny, c:b.c });

    var cell = grid[nx + "," + ny];
    if (!cell){ q.push({ x:nx, y:ny, d:b.d, c:b.c }); continue; }
    if (cell.t === "wall" || cell.t === "emit") continue;
    if (cell.t === "target"){ acc[nx + "," + ny] |= b.c; continue; }
    if (cell.t === "filter"){
      var c2 = b.c & cell.color;
      if (c2) q.push({ x:nx, y:ny, d:b.d, c:c2 });
      continue;
    }
    if (cell.t === "mirror"){
      q.push({ x:nx, y:ny, d:reflect(b.d, oris[cell.id]), c:b.c });
      continue;
    }
    if (cell.t === "split"){
      q.push({ x:nx, y:ny, d:reflect(b.d, oris[cell.id]), c:b.c });
      q.push({ x:nx, y:ny, d:b.d, c:b.c });
      continue;
    }
  }

  var solved = lv.cells.every(function(c){
    return c.t !== "target" || acc[c.x + "," + c.y] === c.color;
  });
  return { segs:segs, acc:acc, solved:solved };
}
</script>

<script id="ui">
/* ---------- LUMEN UI ---------- */
var HEX = {0:"#3a4160",1:"#ff3f5f",2:"#3dffa0",3:"#ffd93b",4:"#4d9dff",5:"#ff5ce6",6:"#3bfff0",7:"#ffffff"};

var cv = document.getElementById("cv");
var ctx = cv.getContext("2d");

var li = 0;
var lv = LEVELS[0];
var oris = lv.start.slice();
var moves = 0;
var solvedSet = {};
var sim = simulate(lv, oris);
var pulse = {};      // cell key -> tap animation timestamp
var winAt = 0;
var size = 400, cell = 57;

function key(c){ return c.x + "," + c.y; }

function fit(){
  var w = Math.min(cv.parentNode.clientWidth, 520);
  size = w;
  cell = size / lv.w;
  var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = size * dpr;
  cv.height = size * dpr;
  cv.style.height = size + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function load(i){
  li = ((i % LEVELS.length) + LEVELS.length) % LEVELS.length;
  lv = LEVELS[li];
  oris = lv.start.slice();
  moves = 0;
  winAt = 0;
  pulse = {};
  sim = simulate(lv, oris);
  document.getElementById("lvlNo").textContent = "Level " + (li + 1) + " of " + LEVELS.length;
  document.getElementById("lvlName").textContent = lv.name;
  document.getElementById("hint").textContent = lv.hint || "Flip the pieces until every target glows.";
  document.getElementById("win").classList.remove("show");
  document.getElementById("prev").disabled = (li === 0);
  document.getElementById("next").disabled = (li === LEVELS.length - 1);
  fit();
  drawDots();
  updateMoves();
}

function updateMoves(){
  document.getElementById("moves").textContent = moves + (moves === 1 ? " TAP" : " TAPS");
}

function drawDots(){
  var d = document.getElementById("dots");
  d.innerHTML = "";
  LEVELS.forEach(function(_, i){
    var e = document.createElement("div");
    e.className = "dot" + (solvedSet[i] ? " done" : "") + (i === li ? " cur" : "");
    e.textContent = i + 1;
    e.onclick = function(){ load(i); };
    d.appendChild(e);
  });
}

/* ---------- input ---------- */
function tapAt(px, py){
  if (document.getElementById("win").classList.contains("show")) return;
  var gx = Math.floor(px / cell), gy = Math.floor(py / cell);
  var hit = null;
  lv.cells.forEach(function(c){ if (c.x === gx && c.y === gy) hit = c; });
  if (!hit || hit.id === undefined) return;

  oris[hit.id] ^= 1;
  moves++;
  pulse[key(hit)] = performance.now();
  sim = simulate(lv, oris);
  updateMoves();

  if (sim.solved && !winAt){
    winAt = performance.now();
    solvedSet[li] = true;
    drawDots();
    var wl = li;
    setTimeout(function(){
      if (li !== wl || !sim.solved) return;
      var w = document.getElementById("win");
      var last = (li === LEVELS.length - 1);
      document.getElementById("winSub").textContent =
        last ? "That's every level — " + moves + " taps on the last one." : "Solved in " + moves + " taps.";
      document.getElementById("cont").textContent = last ? "Play again ↺" : "Next Level →";
      w.classList.add("show");
    }, 620);
  }
}

cv.addEventListener("pointerdown", function(e){
  var r = cv.getBoundingClientRect();
  tapAt(e.clientX - r.left, e.clientY - r.top);
});

document.getElementById("reset").onclick = function(){ load(li); };
document.getElementById("prev").onclick  = function(){ load(li - 1); };
document.getElementById("next").onclick  = function(){ load(li + 1); };
document.getElementById("cont").onclick  = function(){
  if (li === LEVELS.length - 1){ solvedSet = {}; load(0); } else { load(li + 1); }
};
window.addEventListener("resize", fit);

/* ---------- drawing ---------- */
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function cc(x){ return (x + 0.5) * cell; }

function drawGrid(){
  ctx.save();
  ctx.strokeStyle = "rgba(255,255,255,.045)";
  ctx.lineWidth = 1;
  for (var i = 1; i < lv.w; i++){
    ctx.beginPath(); ctx.moveTo(i * cell, 6); ctx.lineTo(i * cell, size - 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, i * cell); ctx.lineTo(size - 6, i * cell); ctx.stroke();
  }
  ctx.restore();
}

function drawBeams(t){
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.lineCap = "round";
  for (var pass = 0; pass < 2; pass++){
    sim.segs.forEach(function(s){
      var col = HEX[s.c] || "#fff";
      ctx.strokeStyle = col;
      if (pass === 0){ ctx.globalAlpha = 0.13; ctx.lineWidth = cell * 0.34; ctx.setLineDash([]); }
      else { ctx.globalAlpha = 0.95; ctx.lineWidth = 2.6; ctx.setLineDash([]); }
      ctx.beginPath();
      ctx.moveTo(cc(s.x1), cc(s.y1));
      ctx.lineTo(cc(s.x2), cc(s.y2));
      ctx.stroke();
    });
  }
  // flowing sparkle along each beam
  ctx.globalAlpha = 0.85;
  ctx.setLineDash([cell * 0.16, cell * 0.5]);
  ctx.lineDashOffset = -(t / 5) % 1000;
  ctx.lineWidth = 4.4;
  sim.segs.forEach(function(s){
    ctx.strokeStyle = HEX[s.c] || "#fff";
    ctx.beginPath();
    ctx.moveTo(cc(s.x1), cc(s.y1));
    ctx.lineTo(cc(s.x2), cc(s.y2));
    ctx.stroke();
  });
  ctx.setLineDash([]);
  ctx.restore();
}

function drawEmit(c){
  var x = cc(c.x), y = cc(c.y), r = cell * 0.30, col = HEX[c.color];
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(c.dir * Math.PI / 2);
  ctx.fillStyle = "#141a30"; ctx.strokeStyle = col; ctx.lineWidth = 2;
  rr(-r, -r, r * 2, r * 2, r * 0.42); ctx.fill(); ctx.stroke();
  ctx.fillStyle = col;
  ctx.shadowColor = col; ctx.shadowBlur = 16;
  ctx.beginPath();
  ctx.moveTo(r * 0.15, -r * 0.42); ctx.lineTo(r * 0.95, 0); ctx.lineTo(r * 0.15, r * 0.42);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.beginPath(); ctx.arc(-r * 0.22, 0, r * 0.24, 0, 7); ctx.fill();
  ctx.restore();
}

function drawWall(c){
  var x = c.x * cell, y = c.y * cell, p = cell * 0.19;
  ctx.save();
  ctx.fillStyle = "rgba(255,255,255,.05)";
  ctx.strokeStyle = "rgba(255,255,255,.11)";
  ctx.lineWidth = 1.4;
  rr(x + p, y + p, cell - p * 2, cell - p * 2, cell * 0.14);
  ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawMirror(c, t){
  var x = cc(c.x), y = cc(c.y), r = cell * 0.34;
  var o = oris[c.id];
  var pt = pulse[key(c)] || -9999;
  var age = (t - pt) / 190;
  var spin = age < 1 ? (1 - age) * (o === 1 ? -0.62 : 0.62) : 0;
  var ang = (o === 0 ? -Math.PI / 4 : Math.PI / 4) + spin;

  ctx.save();
  ctx.translate(x, y);
  // tappable halo
  ctx.fillStyle = "rgba(255,255,255,.035)";
  ctx.beginPath(); ctx.arc(0, 0, cell * 0.42, 0, 7); ctx.fill();
  ctx.rotate(ang);
  if (c.t === "split"){
    ctx.strokeStyle = "rgba(200,225,255,.42)";
    ctx.lineWidth = cell * 0.115;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.stroke();
    ctx.strokeStyle = "#dfe9ff";
    ctx.lineWidth = 2;
    ctx.setLineDash([cell * 0.09, cell * 0.075]);
    ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.stroke();
    ctx.setLineDash([]);
  } else {
    var g = ctx.createLinearGradient(0, -4, 0, 4);
    g.addColorStop(0, "#ffffff"); g.addColorStop(0.5, "#a9c4ff"); g.addColorStop(1, "#4a5a92");
    ctx.strokeStyle = g;
    ctx.lineWidth = cell * 0.125;
    ctx.lineCap = "round";
    ctx.shadowColor = "rgba(160,200,255,.55)"; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function drawFilter(c){
  var x = c.x * cell, y = c.y * cell, p = cell * 0.16, col = HEX[c.color];
  ctx.save();
  ctx.globalAlpha = 0.22; ctx.fillStyle = col;
  rr(x + p, y + p, cell - p * 2, cell - p * 2, cell * 0.16); ctx.fill();
  ctx.globalAlpha = 1; ctx.strokeStyle = col; ctx.lineWidth = 1.8;
  rr(x + p, y + p, cell - p * 2, cell - p * 2, cell * 0.16); ctx.stroke();
  ctx.globalAlpha = 0.5; ctx.lineWidth = 1;
  for (var i = -2; i <= 2; i++){
    ctx.beginPath();
    ctx.moveTo(x + cell * 0.5 + i * cell * 0.13 - cell * 0.16, y + p);
    ctx.lineTo(x + cell * 0.5 + i * cell * 0.13 + cell * 0.16, y + cell - p);
    ctx.stroke();
  }
  ctx.restore();
}

function drawTarget(c, t){
  var x = cc(c.x), y = cc(c.y), r = cell * 0.30;
  var got = sim.acc[key(c)] || 0;
  var ok = got === c.color;
  var want = HEX[c.color];
  ctx.save();
  ctx.translate(x, y);
  if (ok){
    var b = 0.72 + 0.28 * Math.sin(t / 260);
    ctx.shadowColor = want; ctx.shadowBlur = 26 * b;
    ctx.fillStyle = want; ctx.globalAlpha = 0.95;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.78, 0, 7); ctx.fill();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    // spokes
    ctx.strokeStyle = want; ctx.globalAlpha = 0.55; ctx.lineWidth = 2;
    for (var i = 0; i < 8; i++){
      var a = i * Math.PI / 4 + t / 1600;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r * 1.05, Math.sin(a) * r * 1.05);
      ctx.lineTo(Math.cos(a) * r * (1.28 + 0.1 * b), Math.sin(a) * r * (1.28 + 0.1 * b));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  } else {
    if (got){
      ctx.fillStyle = HEX[got]; ctx.globalAlpha = 0.30;
      ctx.beginPath(); ctx.arc(0, 0, r * 0.62, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.setLineDash([cell * 0.07, cell * 0.06]);
  }
  ctx.strokeStyle = want; ctx.lineWidth = 2.4; ctx.globalAlpha = ok ? 1 : 0.72;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
  ctx.setLineDash([]); ctx.globalAlpha = 1;
  ctx.restore();
}

function frame(t){
  ctx.clearRect(0, 0, size, size);
  drawGrid();
  drawBeams(t);
  lv.cells.forEach(function(c){ if (c.t === "wall") drawWall(c); });
  lv.cells.forEach(function(c){ if (c.t === "filter") drawFilter(c); });
  lv.cells.forEach(function(c){ if (c.t === "emit") drawEmit(c); });
  lv.cells.forEach(function(c){ if (c.t === "mirror" || c.t === "split") drawMirror(c, t); });
  lv.cells.forEach(function(c){ if (c.t === "target") drawTarget(c, t); });
  requestAnimationFrame(frame);
}

load(0);
requestAnimationFrame(frame);
</script>
</body>
</html>
