<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Beamline</title>
<style>
  :root{
    --bg:#070b18;
    --panel:rgba(255,255,255,.05);
    --line:rgba(255,255,255,.10);
    --txt:#e8edff;
    --dim:#8892b8;
    --beam:#5ef2ff;
    --gold:#ffd166;
    --pink:#ff6ec7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:
      radial-gradient(1100px 700px at 15% -10%, #172a5e 0%, transparent 60%),
      radial-gradient(900px 600px at 95% 110%, #3a1450 0%, transparent 60%),
      var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    padding:18px 14px 28px;min-height:100%;
  }
  .wrap{width:100%;max-width:560px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
  h1{
    font-size:26px;margin:0;letter-spacing:.14em;font-weight:800;
    background:linear-gradient(92deg,var(--beam),#a78bfa 55%,var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .tag{font-size:11px;color:var(--dim);letter-spacing:.16em;text-transform:uppercase}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
  .stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.25}
  .stat span{font-size:10px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}

  .board{
    position:relative;background:rgba(6,10,24,.55);
    border:1px solid var(--line);border-radius:18px;padding:8px;
    box-shadow:0 20px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
  }
  canvas{display:block;width:100%;height:auto;border-radius:12px;touch-action:manipulation;cursor:pointer}

  .hint{margin:11px 2px 0;font-size:12.5px;color:var(--dim);text-align:center;line-height:1.5}

  .bar{display:flex;gap:8px;margin-top:12px}
  button{
    flex:1;appearance:none;border:1px solid var(--line);border-radius:12px;
    background:rgba(255,255,255,.06);color:var(--txt);
    font-size:13.5px;font-weight:650;padding:12px 8px;cursor:pointer;
    transition:transform .09s ease, background .16s ease, border-color .16s ease;
    font-family:inherit;
  }
  button:hover{background:rgba(255,255,255,.12)}
  button:active{transform:scale(.965)}
  button:disabled{opacity:.38;cursor:default}
  button.primary{
    background:linear-gradient(100deg,rgba(94,242,255,.22),rgba(167,139,250,.26));
    border-color:rgba(94,242,255,.42);
  }

  .win{
    position:absolute;inset:8px;border-radius:12px;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:6px;
    background:rgba(6,10,24,.82);backdrop-filter:blur(7px);
    opacity:0;pointer-events:none;transition:opacity .3s ease;text-align:center;padding:16px;
  }
  .win.show{opacity:1;pointer-events:auto}
  .win h2{margin:0;font-size:27px;letter-spacing:.05em;
    background:linear-gradient(92deg,var(--gold),var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .win p{margin:0;font-size:13px;color:var(--dim)}
  .win button{margin-top:12px;flex:0 0 auto;padding:12px 30px;min-width:190px}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
    background:rgba(20,26,48,.95);border:1px solid var(--line);color:var(--txt);
    padding:9px 16px;border-radius:999px;font-size:12.5px;
    opacity:0;transition:.25s ease;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BEAMLINE</h1>
    <div class="tag">rotate · reflect · ignite</div>
  </header>

  <div class="stats">
    <div class="stat"><b id="sLevel">1</b><span>Level</span></div>
    <div class="stat"><b id="sCrystals">0/0</b><span>Crystals</span></div>
    <div class="stat"><b id="sMoves">0</b><span>Moves</span></div>
  </div>

  <div class="board">
    <canvas id="cv"></canvas>
    <div class="win" id="win">
      <h2 id="winTitle">Circuit Complete</h2>
      <p id="winSub"></p>
      <button class="primary" id="nextBtn">Next Level →</button>
    </div>
  </div>

  <p class="hint">Tap a <b style="color:var(--beam)">mirror</b> to flip it. Steer the beam through every <b style="color:var(--gold)">crystal</b> to light them all. Grey blocks absorb light.</p>

  <div class="bar">
    <button id="resetBtn">Reset</button>
    <button id="hintBtn">Hint</button>
    <button id="newBtn">New Puzzle</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ---------- constants ---------- */
var EMPTY=0, MIRROR=1, CRYSTAL=2, ROCK=3;
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');

/* ---------- helpers ---------- */
function reflect(d,ori){ return ori==='/' ? [-d[1],-d[0]] : [d[1],d[0]]; }
function oriFor(inD,outD){
  var r=reflect(inD,'/');
  return (r[0]===outD[0] && r[1]===outD[1]) ? '/' : '\\';
}
function perps(d){ return [[-d[1],d[0]],[d[1],-d[0]]]; }
function ri(n){ return Math.floor(Math.random()*n); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=ri(i+1), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* ---------- level config ---------- */
function config(lv){
  var N = Math.min(6 + Math.floor((lv-1)/3), 10);
  return {
    N: N,
    mirrors: Math.min(3 + Math.floor((lv-1)*0.8), Math.floor(N*N/6) + 4),
    crystals: Math.min(2 + Math.floor((lv-1)/4), 5),
    rocks: Math.min(1 + Math.floor(lv/2), Math.floor(N*N/8))
  };
}

/* ---------- puzzle generation (always solvable by construction) ---------- */
function generate(lv){
  var cfg = config(lv);
  for(var attempt=0; attempt<400; attempt++){
    var p = tryBuild(cfg);
    if(p) return p;
  }
  return tryBuild(config(1)) || tryBuild(config(1));
}

function tryBuild(cfg){
  var N=cfg.N, i, j;
  var grid=[];
  for(j=0;j<N;j++){ grid.push([]); for(i=0;i<N;i++) grid[j].push({t:EMPTY,ori:null}); }

  // entry point on a random edge
  var side=ri(4), k=ri(N), sx, sy, dir;
  if(side===0){ sx=k; sy=0;   dir=[0,1]; }
  else if(side===1){ sx=N-1; sy=k; dir=[-1,0]; }
  else if(side===2){ sx=k; sy=N-1; dir=[0,-1]; }
  else { sx=0; sy=k; dir=[1,0]; }

  var inb=function(x,y){ return x>=0&&y>=0&&x<N&&y<N; };
  var visited={}, key=function(x,y){ return x+','+y; };
  var cx=sx, cy=sy, d=dir.slice();
  visited[key(cx,cy)]=1;
  var path=[[cx,cy]], mirrorCells=[];

  for(var m=0; m<cfg.mirrors; m++){
    // run forward a random distance through free cells
    var run = 1 + ri(3), steps=0;
    while(steps<run){
      var nx=cx+d[0], ny=cy+d[1];
      if(!inb(nx,ny) || visited[key(nx,ny)]) break;
      cx=nx; cy=ny; visited[key(cx,cy)]=1; path.push([cx,cy]); steps++;
    }
    // try to turn here
    var opts=shuffle(perps(d)), turned=false;
    for(var o=0;o<opts.length;o++){
      var t=opts[o], tx=cx+t[0], ty=cy+t[1];
      if(inb(tx,ty) && !visited[key(tx,ty)]){
        grid[cy][cx].t=MIRROR;
        grid[cy][cx].ori=oriFor(d,t);
        mirrorCells.push([cx,cy]);
        d=t; turned=true;
        break;
      }
    }
    if(!turned) break;
  }
  // let the beam run out to the edge
  while(true){
    var ex=cx+d[0], ey=cy+d[1];
    if(!inb(ex,ey) || visited[key(ex,ey)]) break;
    cx=ex; cy=ey; visited[key(cx,cy)]=1; path.push([cx,cy]);
  }

  if(mirrorCells.length < Math.max(2, Math.min(3,cfg.mirrors))) return null;

  // crystals on non-mirror path cells
  var free=[];
  for(var p=0;p<path.length;p++){
    var c=path[p];
    if(grid[c[1]][c[0]].t===EMPTY) free.push(c);
  }
  if(free.length < cfg.crystals) return null;
  shuffle(free);
  var nC = Math.min(cfg.crystals, free.length);
  for(i=0;i<nC;i++){ grid[free[i][1]][free[i][0]].t=CRYSTAL; }

  // rocks on untouched cells
  var open=[];
  for(j=0;j<N;j++) for(i=0;i<N;i++){ if(!visited[key(i,j)]) open.push([i,j]); }
  shuffle(open);
  for(i=0;i<Math.min(cfg.rocks,open.length);i++){ grid[open[i][1]][open[i][0]].t=ROCK; }

  var solution={};
  for(i=0;i<mirrorCells.length;i++){
    var mc=mirrorCells[i];
    solution[key(mc[0],mc[1])]=grid[mc[1]][mc[0]].ori;
  }

  var state={ N:N, grid:grid, sx:sx, sy:sy, dir:dir, mirrors:mirrorCells, solution:solution, crystals:nC };

  // scramble, avoiding an already-solved board
  for(var tries=0; tries<80; tries++){
    for(i=0;i<mirrorCells.length;i++){
      var q=mirrorCells[i];
      grid[q[1]][q[0]].ori = Math.random()<0.5 ? '/' : '\\';
    }
    if(!trace(state).solved) return state;
  }
  // fall back: flip every mirror from the solution
  for(i=0;i<mirrorCells.length;i++){
    var z=mirrorCells[i];
    grid[z[1]][z[0]].ori = solution[key(z[0],z[1])]==='/' ? '\\' : '/';
  }
  return trace(state).solved ? null : state;
}

/* ---------- beam tracing ---------- */
function trace(st){
  var N=st.N, x=st.sx, y=st.sy, d=st.dir.slice();
  var cells=[], lit={}, litCount=0, seen={}, endKind='exit';
  var guard=0;
  while(guard++ < 4*N*N+50){
    if(x<0||y<0||x>=N||y>=N){ endKind='exit'; break; }
    var k=x+','+y+','+d[0]+','+d[1];
    if(seen[k]){ endKind='loop'; break; }
    seen[k]=1;
    var cell=st.grid[y][x];
    if(cell.t===ROCK){ endKind='rock'; break; }
    cells.push([x,y]);
    if(cell.t===CRYSTAL && !lit[x+','+y]){ lit[x+','+y]=1; litCount++; }
    if(cell.t===MIRROR){ d=reflect(d,cell.ori); }
    x+=d[0]; y+=d[1];
  }
  return {
    cells:cells, lit:lit, litCount:litCount, dir:d,
    endKind:endKind, endX:x, endY:y,
    solved: litCount===st.crystals && st.crystals>0
  };
}

/* ---------- app state ---------- */
var level=1, moves=0, hintsUsed=0, st=null, beam=null, solvedNow=false, t0=performance.now();

function newPuzzle(keepLevel){
  if(!keepLevel) level=1;
  st=generate(level);
  moves=0; hintsUsed=0; solvedNow=false;
  document.getElementById('win').classList.remove('show');
  document.getElementById('hintBtn').disabled=false;
  update();
}
function update(){
  beam=trace(st);
  document.getElementById('sLevel').textContent=level;
  document.getElementById('sCrystals').textContent=beam.litCount+'/'+st.crystals;
  document.getElementById('sMoves').textContent=moves;
  layout();
  if(beam.solved && !solvedNow){
    solvedNow=true;
    setTimeout(function(){
      document.getElementById('winSub').textContent =
        'Level '+level+' cleared in '+moves+' move'+(moves===1?'':'s')+
        (hintsUsed? ' · '+hintsUsed+' hint'+(hintsUsed===1?'':'s') : '');
      document.getElementById('win').classList.add('show');
    }, 480);
  }
}

/* ---------- rendering ---------- */
var CS=48, PAD=22, dpr=1;
function layout(){
  var boardW=Math.min(document.querySelector('.wrap').clientWidth - 18, 520);
  CS=Math.floor((boardW - PAD*2)/st.N);
  var size=CS*st.N + PAD*2;
  dpr=Math.min(window.devicePixelRatio||1, 2.5);
  cv.width=Math.round(size*dpr); cv.height=Math.round(size*dpr);
  cv.style.width=size+'px'; cv.style.height=size+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
function cx0(i){ return PAD + i*CS + CS/2; }
function cy0(j){ return PAD + j*CS + CS/2; }

function draw(){
  var t=(performance.now()-t0)/1000;
  var W=CS*st.N+PAD*2;
  ctx.clearRect(0,0,W,W);

  // board backdrop
  ctx.fillStyle='rgba(255,255,255,.022)';
  roundRect(PAD-6, PAD-6, CS*st.N+12, CS*st.N+12, 12); ctx.fill();

  // grid
  ctx.strokeStyle='rgba(255,255,255,.055)'; ctx.lineWidth=1;
  for(var g=0; g<=st.N; g++){
    var p=PAD+g*CS+.5;
    ctx.beginPath(); ctx.moveTo(p,PAD); ctx.lineTo(p,PAD+CS*st.N); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PAD,p); ctx.lineTo(PAD+CS*st.N,p); ctx.stroke();
  }

  drawEmitter(t);
  drawBeam(t);

  for(var j=0;j<st.N;j++) for(var i=0;i<st.N;i++){
    var c=st.grid[j][i];
    if(c.t===ROCK) drawRock(i,j);
    else if(c.t===CRYSTAL) drawCrystal(i,j, !!beam.lit[i+','+j], t);
    else if(c.t===MIRROR) drawMirror(i,j,c.ori);
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawEmitter(t){
  var ex=cx0(st.sx)-st.dir[0]*CS, ey=cy0(st.sy)-st.dir[1]*CS;
  var pulse=0.6+0.4*Math.sin(t*3);
  ctx.save();
  ctx.translate(ex,ey);
  ctx.rotate(Math.atan2(st.dir[1],st.dir[0]));
  ctx.shadowColor='rgba(94,242,255,.9)'; ctx.shadowBlur=16*pulse;
  ctx.fillStyle='#5ef2ff';
  ctx.beginPath();
  ctx.moveTo(CS*0.30,0); ctx.lineTo(-CS*0.16,-CS*0.20); ctx.lineTo(-CS*0.16,CS*0.20);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawBeam(t){
  var pts=[];
  var ex=cx0(st.sx)-st.dir[0]*CS*0.5, ey=cy0(st.sy)-st.dir[1]*CS*0.5;
  pts.push([ex,ey]);
  for(var i=0;i<beam.cells.length;i++) pts.push([cx0(beam.cells[i][0]), cy0(beam.cells[i][1])]);
  if(beam.cells.length){
    var last=beam.cells[beam.cells.length-1];
    var f = beam.endKind==='loop' ? 0 : 0.5;
    if(f) pts.push([cx0(last[0])+beam.dir[0]*CS*f, cy0(last[1])+beam.dir[1]*CS*f]);
  }
  if(pts.length<2) return;

  var path=new Path2D();
  path.moveTo(pts[0][0],pts[0][1]);
  for(var k=1;k<pts.length;k++) path.lineTo(pts[k][0],pts[k][1]);

  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.save();
  ctx.shadowColor='rgba(94,242,255,.85)'; ctx.shadowBlur=18;
  ctx.strokeStyle='rgba(94,242,255,.20)'; ctx.lineWidth=Math.max(9,CS*0.26); ctx.stroke(path);
  ctx.strokeStyle='rgba(140,246,255,.55)'; ctx.lineWidth=Math.max(4,CS*0.11); ctx.stroke(path);
  ctx.shadowBlur=8;
  ctx.strokeStyle='#eafcff'; ctx.lineWidth=Math.max(1.6,CS*0.045); ctx.stroke(path);
  // flowing energy dashes
  ctx.setLineDash([CS*0.16, CS*0.42]);
  ctx.lineDashOffset = -((performance.now()-t0)/1000)*CS*2.6;
  ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=Math.max(2.2,CS*0.075); ctx.stroke(path);
  ctx.setLineDash([]);
  ctx.restore();
}

function drawMirror(i,j,ori){
  var x=cx0(i), y=cy0(j), r=CS*0.31;
  var dx = ori==='/' ? r : -r;
  ctx.save();
  // seat
  ctx.fillStyle='rgba(167,139,250,.10)';
  roundRect(x-CS*0.40, y-CS*0.40, CS*0.80, CS*0.80, CS*0.16); ctx.fill();
  ctx.strokeStyle='rgba(167,139,250,.28)'; ctx.lineWidth=1;
  roundRect(x-CS*0.40, y-CS*0.40, CS*0.80, CS*0.80, CS*0.16); ctx.stroke();
  // mirror bar
  ctx.lineCap='round';
  ctx.shadowColor='rgba(200,220,255,.85)'; ctx.shadowBlur=10;
  var grad=ctx.createLinearGradient(x-dx, y+r, x+dx, y-r);
  grad.addColorStop(0,'#8fb6ff'); grad.addColorStop(.5,'#ffffff'); grad.addColorStop(1,'#c9a7ff');
  ctx.strokeStyle=grad; ctx.lineWidth=Math.max(3.5,CS*0.11);
  ctx.beginPath(); ctx.moveTo(x-dx, y+r); ctx.lineTo(x+dx, y-r); ctx.stroke();
  ctx.restore();
}

function drawCrystal(i,j,lit,t){
  var x=cx0(i), y=cy0(j), r=CS*(lit ? 0.30+0.022*Math.sin(t*4.5) : 0.26);
  ctx.save();
  ctx.translate(x,y);
  if(lit){ ctx.shadowColor='rgba(255,209,102,.95)'; ctx.shadowBlur=22; }
  ctx.beginPath();
  ctx.moveTo(0,-r); ctx.lineTo(r*0.72,0); ctx.lineTo(0,r); ctx.lineTo(-r*0.72,0); ctx.closePath();
  if(lit){
    var g=ctx.createLinearGradient(0,-r,0,r);
    g.addColorStop(0,'#fff4cf'); g.addColorStop(1,'#ffb443');
    ctx.fillStyle=g; ctx.fill();
  } else {
    ctx.fillStyle='rgba(255,209,102,.10)'; ctx.fill();
    ctx.strokeStyle='rgba(255,209,102,.60)'; ctx.lineWidth=Math.max(1.6,CS*0.05); ctx.stroke();
  }
  ctx.restore();
}

function drawRock(i,j){
  var x=cx0(i), y=cy0(j), s=CS*0.66;
  ctx.save();
  ctx.fillStyle='rgba(255,255,255,.085)';
  roundRect(x-s/2, y-s/2, s, s, CS*0.13); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=1;
  roundRect(x-s/2, y-s/2, s, s, CS*0.13); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.13)'; ctx.lineWidth=Math.max(1.4,CS*0.04);
  ctx.beginPath();
  ctx.moveTo(x-s*0.22,y-s*0.05); ctx.lineTo(x+s*0.05,y-s*0.28);
  ctx.moveTo(x-s*0.05,y+s*0.28); ctx.lineTo(x+s*0.24,y+s*0.02);
  ctx.stroke();
  ctx.restore();
}

/* ---------- interaction ---------- */
cv.addEventListener('pointerdown', function(e){
  if(beam && beam.solved) return;
  var rect=cv.getBoundingClientRect();
  var px=(e.clientX-rect.left)*(cv.width/dpr)/rect.width;
  var py=(e.clientY-rect.top)*(cv.height/dpr)/rect.height;
  var i=Math.floor((px-PAD)/CS), j=Math.floor((py-PAD)/CS);
  if(i<0||j<0||i>=st.N||j>=st.N) return;
  var c=st.grid[j][i];
  if(c.t!==MIRROR) return;
  c.ori = c.ori==='/' ? '\\' : '/';
  moves++;
  update();
});

function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._tm);
  el._tm=setTimeout(function(){ el.classList.remove('show'); }, 1600);
}

document.getElementById('resetBtn').onclick=function(){
  for(var i=0;i<st.mirrors.length;i++){
    var m=st.mirrors[i];
    st.grid[m[1]][m[0]].ori = Math.random()<.5 ? '/' : '\\';
  }
  moves=0; solvedNow=false;
  document.getElementById('win').classList.remove('show');
  update();
};

document.getElementById('hintBtn').onclick=function(){
  var wrong=[];
  for(var i=0;i<st.mirrors.length;i++){
    var m=st.mirrors[i], k=m[0]+','+m[1];
    if(st.grid[m[1]][m[0]].ori !== st.solution[k]) wrong.push(m);
  }
  if(!wrong.length){ toast('Every mirror already matches a solution.'); return; }
  var pick=wrong[ri(wrong.length)];
  st.grid[pick[1]][pick[0]].ori = st.solution[pick[0]+','+pick[1]];
  hintsUsed++; moves++;
  toast('One mirror snapped into place.');
  update();
};

document.getElementById('newBtn').onclick=function(){ newPuzzle(true); };
document.getElementById('nextBtn').onclick=function(){ level++; newPuzzle(true); };
window.addEventListener('resize', function(){ if(st) layout(); });

/* ---------- loop ---------- */
newPuzzle(false);
(function frame(){ if(st) draw(); requestAnimationFrame(frame); })();

})();
</script>
</body>
</html>
